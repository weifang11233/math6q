user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # ── AI 判分上游（v3.6 起完全指向 Agent2API 网关）───────────────
  # 主：Agent2API 网关（20+ 判分模型，前端 aiRequest() 按需故障转移）。
  # 原 freellmapi :3201 与 Windows Ollama 备胎已移除：它们不支持新模型名，
  # 切过去会 404，反而干扰前端的 20 模型容灾链。
  # 模型级故障转移由前端 aiRequest() 负责（超时/限流/失效即切下一个）。
  upstream ai_backend {
    server __LLM_GATEWAY_HOST__;                       # 例：192.168.31.88:3065
  }

  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/site;
    index index.html;

    # 入口页禁止缓存，保证部署后用户立即拿到新版本
    location = /index.html {
      add_header Cache-Control "no-store, no-cache, must-revalidate";
      try_files $uri =404;
    }
    location / { try_files $uri $uri/ =404; }

    # ── 云端同步 API 反向代理（v2.4 起）───────────────────────────
    # 账号表 + 学习存档集中存 NAS，由 server/server.js 提供
    location /api/ {
      proxy_pass http://__API_SERVER_HOST__/api/;      # 例：192.168.31.88:8877
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_read_timeout 30s;
      client_max_body_size 6m;
    }

    # ── AI 网关反向代理 ────────────────────────────────────────────
    # 浏览器不持有 Key：前端请求同源 /ai/ → nginx 转发到网关 /v1/ 并在服务端注入 Authorization。
    # 模型名由前端请求体携带，命中候选链中的可用模型；失效即切下一个。
    # 部署时用真实 Key 替换占位符；本模板文件绝不写真实密钥。
    # /ai/models 也会被同样转发，供管理员面板「获取模型列表」使用。
    location /ai/ {
      proxy_pass http://ai_backend/v1/;
      proxy_set_header Authorization "Bearer __LLM_API_KEY__";
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_connect_timeout 5s;
      proxy_read_timeout 120s;
      proxy_buffering off;
      client_max_body_size 12m;   # 拍照判分的 base64 图片需要放宽限制
    }
  }
}
