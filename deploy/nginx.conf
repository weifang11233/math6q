user root;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html/site;
    index index.html;
    location / { try_files $uri $uri/ =404; }

    # ── AI 网关反向代理 ────────────────────────────────────────────
    # 页面/浏览器不持有 API Key：前端请求同源 /ai/chat/completions，
    # 由 nginx 转发到网关并在服务端注入 Authorization。
    # 部署时用真实 Key 替换下一行的占位符；本模板文件绝不写真实密钥。
    # /ai/models 也会被同样转发，供管理员面板「获取模型列表」使用。
    location /ai/ {
      proxy_pass __LLM_GATEWAY__/v1/;
      proxy_set_header Authorization "Bearer __LLM_API_KEY__";
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_read_timeout 120s;
      proxy_buffering off;
      client_max_body_size 12m;   # 拍照判分的 base64 图片需要放宽限制
    }
  }
}
