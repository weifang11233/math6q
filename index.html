<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>六上数学乐园 · 青岛版</title>
<style>
:root{
  --bg:#F7F4EC; --card:#FFFFFF; --ink:#3A352B; --sub:#8A8474;
  --green:#2E6B4F; --greenL:#EAF2ED; --orange:#E8833A; --orangeL:#FDF1E6;
  --blue:#3A6EA5; --blueL:#EAF1F8; --red:#C0392B; --redL:#FBEAE7;
  --gold:#B8860B; --line:#E5E0D2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbtn{border:none;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.topbar h1{font-size:19px;flex:1}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1.5px solid var(--line)}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15.5px;margin:10px 0 6px}
.muted{color:var(--sub);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modbtn{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800;font-size:15px}
.modbtn small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;margin-top:3px}
.modbtn:active{transform:scale(.97)}
.unitbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.unitbtn .no{width:38px;height:38px;border-radius:12px;color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.unitbtn .tt{flex:1}
.unitbtn .tt b{font-size:15.5px}
.unitbtn .tt small{display:block;color:var(--sub);font-size:12px}
.badge{background:var(--greenL);color:var(--green);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.gray{background:#EFECE3;color:var(--sub)}
.kp{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.kp.lit{border-color:var(--green);background:var(--greenL)}
.kp .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px}
.kp .head .dot{width:22px;height:22px;border-radius:50%;background:#E8E4D8;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.kp.lit .head .dot{background:var(--green);color:#fff}
.btn{display:inline-block;border:none;border-radius:12px;padding:11px 22px;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff;background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}
.btn.plain{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.qstem{font-size:19px;font-weight:800;margin:14px 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;font-weight:700;margin-bottom:10px;cursor:pointer}
.opt:active{background:var(--greenL)}
.opt.right{border-color:var(--green);background:var(--greenL)}
.opt.wrong{border-color:var(--red);background:var(--redL)}
input.ansin{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;background:var(--card);color:var(--ink);outline:none}
input.ansin:focus{border-color:var(--green)}
.fb{border-radius:14px;padding:13px 15px;margin-top:12px;font-size:14.5px;display:none}
.fb.ok{display:block;background:var(--greenL);color:var(--green);border:1.5px solid #BFDCCB}
.fb.no{display:block;background:var(--redL);color:var(--red);border:1.5px solid #EBBDB6}
.fb b{font-size:15px}
.exbox{background:var(--blueL);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.exambox{background:var(--orangeL);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.tag{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:800;color:#fff;margin-right:6px}
.statrow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:14.5px}
.bar{height:8px;border-radius:4px;background:#EFECE3;overflow:hidden;flex:1;margin:0 10px}
.bar i{display:block;height:100%;background:var(--green)}
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
table.rep th{color:var(--sub);font-weight:700}
h2.sec{font-size:18px;margin:4px 0 12px}
.step{display:flex;gap:10px;margin-bottom:12px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pctchip{display:inline-block;background:var(--orangeL);color:var(--orange);border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;margin:2px 4px 2px 0}
.bigday{text-align:center;padding:18px 0 8px}
.bigday b{font-size:34px;color:var(--green)}
.cheat{border-bottom:1px solid var(--line);padding:10px 0}
.cheat b{color:var(--green)}
.footer-tip{text-align:center;color:var(--sub);font-size:12px;margin-top:18px}
.flash-ok{animation:fo .4s}
@keyframes fo{0%{background:#D8EDE0}100%{background:var(--greenL)}}
svg.map{width:100%;height:auto}
/* 教科书式分数：分子在上、分母在下、中间横线 */
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.05}
.frac .nu{display:block;padding:0 4px;border-bottom:1.6px solid currentColor}
.frac .de{display:block;padding:0 4px}
/* 密码输入行：显隐切换 */
.pwdwrap{position:relative}
.pwdwrap input{width:100%;padding-right:44px;box-sizing:border-box}
.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:18px;cursor:pointer;padding:4px;line-height:1;color:var(--sub)}
.qstem .frac{font-size:19px}
.opt .frac{font-size:16.5px;display:inline-block}
.kp .frac{font-size:14px}
.fb .frac{font-size:14px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ═══════════════════════════════════════════════════════
   六上数学乐园 · 青岛版（六三制）六年级上册
   原创实现：知识卡 → 过关点亮 → 出题 → 错题隔日重考
   数据全部存在本机 localStorage，断网可用
   ═══════════════════════════════════════════════════════ */

/* ───────── 工具函数 ───────── */
function R(n){return Math.floor(Math.random()*n)}
function pick(a){return a[R(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}
function frac(n,d){var g=gcd(n,d);n=n/g;d=d/g;return d===1?String(n):(n+'/'+d)}
/* 纯文本分数（存档/比对用），HTML 分数（界面显示用，横线式） */
function fracHTML(n,d){
  var g=gcd(n,d);n=n/g;d=d/g;
  if(d===1)return String(n);
  if(n<0)return '<span class="frac"><span class="nu">−'+(-n)+'</span><span class="de">'+d+'</span></span>';
  return '<span class="frac"><span class="nu">'+n+'</span><span class="de">'+d+'</span></span>';
}
/* 把字符串里的 a/b（最简或非最简）渲染成横线分数；支持 a/b × c/d 等混排 */
function rich(s){
  return String(s).replace(/(\d+)\/(\d+)/g,function(m,a,b){
    return fracHTML(+a,+b);
  });
}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function val(s){
  s=String(s).trim().replace(/%$/,'').replace(/^\+/,'');
  if(!s)return null;
  var m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m){var d=+m[2];if(!d)return null;return +m[1]/d}
  var f=parseFloat(s);return isNaN(f)?null:f;
}
function checkAns(q,user){
  var u=String(user||'').trim();
  if(q.ratio){
    var m=u.match(/^(\d+)\s*[:：]\s*(\d+)$/);if(!m)return false;
    var g=gcd(+m[1],+m[2]);
    var c=q.ans.match(/^(\d+)[:：](\d+)$/);var g2=gcd(+c[1],+c[2]);
    return +m[1]/g===+c[1]/g2 && +m[2]/g===+c[2]/g2;
  }
  var uv=val(u),cv=val(q.ans);
  if(uv===null||cv===null)return false;
  return Math.abs(uv-cv)<1e-9;
}

/* ───────── 用户系统（注册/登录/管理员）─────────
   存储：localStorage 永久保存 + 双备份快照防覆盖 + 管理员可导出 JSON 文件兜底
   安全：密码不明文存储——SHA-256(随机盐 + 密码) 哈希（纯 JS 实现，兼容 http 环境） */
/* ───────── 存储可用性探测与安全包装 ─────────
   IDE 预览面板/隐私模式会禁用 localStorage（写入抛 SecurityError）。
   探测失败 → 自动降级为内存存储：应用照常运行，但数据仅本次会话有效，页面明确提示。 */
var LS_OK=true,LS_MEM={};
function lsProbe(){try{localStorage.setItem('__ls_probe','1');localStorage.removeItem('__ls_probe');return true}catch(e){return false}}
LS_OK=lsProbe();
function lsGet(k){if(!LS_OK&&lsProbe())LS_OK=true;if(LS_OK){try{return localStorage.getItem(k)}catch(e){LS_OK=false}}return Object.prototype.hasOwnProperty.call(LS_MEM,k)?LS_MEM[k]:null}
function lsSet(k,v){if(!LS_OK&&lsProbe())LS_OK=true;if(LS_OK){try{localStorage.setItem(k,v);return true}catch(e){LS_OK=false}}LS_MEM[k]=String(v);return false}
function lsRm(k){if(LS_OK){try{localStorage.removeItem(k)}catch(e){}}delete LS_MEM[k]}
function lsWarn(){return '⚠ 当前浏览器环境不支持本地存储（常见于 IDE 预览面板、隐私模式），数据<b>仅保存在本次会话中</b>——刷新即丢失。请用系统浏览器（Chrome/Edge）打开本页或访问 NAS 网址，才能永久保存。'}
var UKEY='qd6_users';        /* 用户表 */
var CKEY='qd6_session';      /* 当前登录会话 */
var BKEY1='qd6_users_bak1';  /* 备份快照 1（每次写入前滚动） */
var BKEY2='qd6_users_bak2';  /* 备份快照 2（隔次滚动，防单点损坏） */
var ADMIN_PHONE='13455656547', ADMIN_PASS='KAyFN&6t253Z#m2x0Fq3';

/* 纯 JS SHA-256（FIPS 180-4，内置实现，兼容 http/https/file） */
function sha256(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a))}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length;
  var isComposite={};
  for(var candidate=2;primeCounter<64;candidate++){
    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    var j=ascii.charCodeAt(i);
    if(j>>8)return;  /* 非 ASCII：外部先转 UTF-8 */
    words[i>>2]|=j<<((3-i)%4)*8;
  }
  words[words.length]=(asciiBitLength/maxWord)|0;
  words[words.length]=asciiBitLength;
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15],w2=w[i-2];
      var a=hash[0],e=hash[4];
      var temp1=hash[7]
        +(rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        +((e&hash[5])^((~e)&hash[6]))+k[i]
        +(w[i]=(i<16)?w[i]:(w[i-16]+(rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3))+w[i-7]+(rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)))|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
      hash[0]=temp1+temp2|0;
    }
    for(i=0;i<8;i++)hash[i]=(hash[i]+oldHash[i])|0;
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}
function str2utf8(s){return decodeURIComponent(encodeURIComponent(s))}
function hashPass(salt,pass){return sha256(str2utf8(salt+'::'+pass))}

/* 用户表读写（带双备份与写入保护） */
function loadUsers(){
  try{var v=JSON.parse(lsGet(UKEY));if(v&&v.users)return v}catch(e){}
  /* 主表损坏/丢失 → 尝试双备份恢复 */
  for(var k of [BKEY1,BKEY2]){
    try{var b=JSON.parse(lsGet(k));if(b&&b.users){console.warn('用户表从备份恢复:',k);return b}}catch(e){}
  }
  return {ver:2,users:[]};
}
function saveUsers(db){
  /* 防覆盖：写入前把旧主表滚入备份（B1←旧值，B2←原B1） */
  try{
    var old=lsGet(UKEY);
    if(old){lsSet(BKEY2,lsGet(BKEY1)||old||'');lsSet(BKEY1,old)}
    db.savedAt=Date.now();
    lsSet(UKEY,JSON.stringify(db));
    return true;
  }catch(e){console.error('用户表保存失败(存储满?)',e);return false}
}
var USERS=loadUsers();
var CUR=null;  /* 当前登录用户 {phone,role,name} 或 null */
try{CUR=JSON.parse(lsGet(CKEY))}catch(e){CUR=null}

/* 预置管理员（仅当不存在时创建；密码哈希存储，不落明文） */
/* 管理员迁移：若存在旧版预置管理员（13800000000 且从未有真实注册行为），自动移除 */
(function(){
  var changed=false;
  /* 1. 移除旧预置管理员（13800000000，角色 admin） */
  var legacy=USERS.users.findIndex(function(x){return x.phone==='13800000000'&&x.role==='admin'});
  if(legacy>=0){USERS.users.splice(legacy,1);changed=true}
  /* 2. 若旧管理员会话还挂着，清掉 */
  try{var sess=JSON.parse(lsGet(CKEY));if(sess&&sess.phone==='13800000000'&&sess.role==='admin'){lsRm(CKEY);CUR=null}}catch(e){}
  /* 3. 预置新管理员 */
  if(!USERS.users.some(function(x){return x.phone===ADMIN_PHONE})){
    var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
    USERS.users.push({phone:ADMIN_PHONE,role:'admin',name:'管理员',salt:salt,hash:hashPass(salt,ADMIN_PASS),regAt:'2026-01-01 00:00:00',lastLogin:null});
    changed=true;
  }
  var adm=findUser(ADMIN_PHONE);
  if(adm&&(adm.lockUntil||adm.failN)){delete adm.lockUntil;adm.failN=0;changed=true}
  if(changed)saveUsers(USERS);
})();

function validPhone(p){return /^1\d{10}$/.test(p)}
/* 密码规则：必须 10 位，同时含数字/大写/小写/特殊符号 */
function passIssue(p){
  if(typeof p!=='string'||p.length!==10)return '密码长度必须恰好 10 位（当前 '+(p?p.length:0)+' 位）';
  if(!/[0-9]/.test(p))return '密码必须包含数字';
  if(!/[A-Z]/.test(p))return '密码必须包含大写字母';
  if(!/[a-z]/.test(p))return '密码必须包含小写字母';
  if(!/[^0-9A-Za-z]/.test(p))return '密码必须包含特殊符号（如 !@#$%^&*）';
  return null;
}
function nowStr(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0')}
function findUser(phone){return USERS.users.find(function(x){return x.phone===phone})}
function setSession(u){CUR=u;try{lsSet(CKEY,JSON.stringify(u))}catch(e){}}
function clearSession(){CUR=null;lsRm(CKEY)}
function isAdmin(){return CUR&&CUR.role==='admin'}

/* 每个用户独立的学习存档键 */
function userKey(phone){return 'qd6_state_'+phone}
function load(){  /* 依据登录态加载对应存档 */
  var def={name:'',lit:{},st:{},wrong:[],days:{},t0:Date.now()};
  if(CUR){try{var v=JSON.parse(lsGet(userKey(CUR.phone)));if(v&&typeof v==='object')return v}catch(e){}return def}
  try{var g=JSON.parse(lsGet(KEY));if(g&&typeof g==='object')return g}catch(e){}
  return def;
}
function save(){try{lsSet(CUR?userKey(CUR.phone):KEY,JSON.stringify(S))}catch(e){}}

/* ───────── 注册 / 登录（界面与逻辑）───────── */
function togglePwd(id,btn){
  var el=document.getElementById(id);
  if(!el)return;
  var show=el.type==='password';
  el.type=show?'text':'password';
  btn.textContent=show?'🙈':'👁';
}
var AUTH_MODE='login';
function doRegister(){
  var ph=(document.getElementById('regPhone').value||'').trim();
  var nm=(document.getElementById('regName').value||'').trim();
  var p1=document.getElementById('regPass').value||'';
  var p2=document.getElementById('regPass2').value||'';
  var msg=document.getElementById('regMsg');
  function fail(t){msg.textContent='✕ '+t}
  if(!ph)return fail('请输入手机号');
  if(!validPhone(ph))return fail('手机号格式不正确：必须 11 位且以 1 开头');
  if(findUser(ph))return fail('该手机号已注册过，请直接登录');
  var issue=passIssue(p1);
  if(issue)return fail(issue);
  if(p1!==p2)return fail('两次输入的密码不一致');
  var salt=Math.random().toString(36).slice(2)+Date.now().toString(36);
  var user={phone:ph,role:'user',name:nm||('同学'+ph.slice(-4)),salt:salt,hash:hashPass(salt,p1),regAt:nowStr(),lastLogin:null};
  USERS.users.push(user);
  if(!saveUsers(USERS)){
    return fail(LS_OK?'保存失败：本机存储空间不足，请联系管理员导出备份清理'
                   :'当前浏览器环境不支持本地存储（IDE 预览面板/隐私模式会这样）。注册已在本次会话内生效（刷新会丢失）；请改用系统浏览器打开以永久保存。');
  }
  msg.style.color='#1E8449';msg.textContent='✓ 注册成功！正在进入…';
  setSession({phone:ph,role:'user',name:user.name});
  S=load();S.name=user.name;save();
  setTimeout(function(){go('home')},600);
}
function doLogin(){
  var ph=(document.getElementById('logPhone').value||'').trim();
  var p=document.getElementById('logPass').value||'';
  var msg=document.getElementById('logMsg');
  function fail(t){msg.textContent='✕ '+t}
  if(!ph)return fail('请输入手机号');
  if(!validPhone(ph))return fail('手机号格式不正确：必须 11 位且以 1 开头');
  var u=findUser(ph);
  if(!u)return fail('该手机号尚未注册，请先注册');

function doUnban(phone){

function savePerms(phone){

  permChanged=false;
}

  var u=findUser(phone);if(!u)return;

  h+=`<div class="card"><p>手机号：${u.phone}｜注册：${u.regAt}｜最近登录：${u.lastLogin||'—'}</p>`;
  if(!sv){h+='<p class="muted">该用户还没有练习记录。</p>'}
  else{
    h+='<table class="rep"><tr><th>单元</th><th>练习</th><th>正确率</th></tr>';
    UNITS.forEach(function(un){
      var s=sv.st[un.id]||{att:0,cor:0};
      var r=s.att?Math.round(s.cor/s.att*100):null;
      h+=`<tr><td style="text-align:left">${un.id} ${un.name}</td><td>${s.att}</td><td>${r===null?'—':r+'%'}</td></tr>`;
    });
    h+='</table>';
    var lit=0;Object.keys(sv.lit||{}).forEach(function(k){if(sv.lit[k])lit++});

function importUsers(){
  var f=document.getElementById('impFile').files[0];
  var m=document.getElementById('admMsg');
  if(!f){m.style.color='#C0392B';m.textContent='✕ 请先选择备份 JSON 文件';return}
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var obj=JSON.parse(rd.result);
      var db=obj.db||obj;
      if(!db.users||!Array.isArray(db.users))throw new Error('格式不对');
      /* 保护：导入前先备份当前主表 */
      try{var old=lsGet(UKEY);if(old){lsSet(BKEY1,old)} }catch(e){}
      USERS=loadUsers();
      /* 合并：按手机号去重，导入的覆盖同号旧档（管理员显式操作） */
      db.users.forEach(function(u){
        var i=USERS.users.findIndex(function(x){return x.phone===u.phone});
        if(i>=0)USERS.users[i]=u;else USERS.users.push(u);
      });
      saveUsers(USERS);
      m.style.color='#1E8449';m.textContent='✓ 恢复完成，当前用户数：'+USERS.users.length;
    }catch(e){m.style.color='#C0392B';m.textContent='✕ 恢复失败：'+e.message}
  };
  rd.readAsText(f);
}

function streak(){
  var n=0,d=new Date();
  for(;;){
    var k=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(S.days[k]&&S.days[k].att>0){n++}else{if(n===0&&k===today()){d.setDate(d.getDate()-1);continue}break}
    d.setDate(d.getDate()-1);
  }
  return n;
}

/* —— 第一单元 分数乘法 —— */
f1_int:function(u,k){
  var d=pick([2,3,4,6,8]),n=1+R(d-1),c=pick([2,3,4,5,6]);
  return{q:`计算：${n}/${d} × ${c} = ？（填最简分数）`,ans:frac(n*c,d),unit:u,kp:k,
    exp:`分子乘整数：${n}×${c}=${n*c}，分母 ${d} 不变 → ${n*c}/${d}，约分得 ${frac(n*c,d)}。口诀：乘分子、不变母，先约分再相乘。`};
},
f1_int_app:function(u,k){
  var d=pick([4,5,8]),n=1+R(d-1),c=pick([3,4,6]);
  var v=frac(n*c,d);
  return{q:`一根彩绳每段长 ${n}/${d} 米，剪这样的 ${c} 段，一共多少米？（填数，单位已给）`,
    ans:v,unit:u,kp:k,app:1,
    exp:`求 ${c} 个 ${n}/${d} 米是多少，用乘法：${n}/${d}×${c}=${v}（米）。`};
},
f1_ff:function(u,k){
  var a=pick([1,2,3]),b=pick([2,3,4,5]),c=pick([1,2]),dd=pick([3,4,5,6,7,9]);
  if(gcd(a*c,b*dd)===a*c&&a*c!==1&&b*dd!==1){c=c}
  return{q:`计算：${a}/${b} × ${c}/${dd} = ？（填最简分数）`,ans:frac(a*c,b*dd),unit:u,kp:k,
    exp:`分子乘分子 ${a}×${c}=${a*c}，分母乘分母 ${b}×${dd}=${b*dd} → ${a*c}/${b*dd}，约分得 ${frac(a*c,b*dd)}。`};
},
f1_ff_err:function(u,k){
  var dd=pick([2,4,8]);
  var good='1/'+(dd*dd),bad='1/'+(dd*dd*dd);
  return{q:`易错提醒题：1/${dd} × 1/${dd} = ？（填最简分数）`,ans:good,unit:u,kp:k,
    ops:shuffle([good,bad,'1/'+(dd*dd+dd)]),
    exp:`分子乘分子 1×1=1，分母乘分母 ${dd}×${dd}=${dd*dd}，得 ${good}。分母是乘出来的，别再翻倍！`};
},
f1_of:function(u,k){
  var d=pick([3,4,6]),n=1,parts=[[84,3],[60,4],[90,6],[120,6],[72,3]];
  var p=pick(parts),W=p[0],dd=p[1],nn=pick([1,2,5]);
  var v=W*nn/dd;
  return{q:`果园里有 ${W} 棵苹果树，梨树的棵数是苹果树的 ${nn}/${dd}。梨树有多少棵？（填数）`,
    ans:String(v),unit:u,kp:k,app:1,
    exp:`求一个数的几分之几用乘法：${W}×${nn}/${dd}=${v}（棵）。先找准单位 1——"苹果树"是单位 1。`};
},
f1_of_chain:function(u,k){
  var W=pick([240,360,480]),a=pick([2,3]),b=pick([3,4,5]),c=1,dd=pick([2,3]);
  var v=W*a/b*c/dd;
  return{q:`一本书共 ${W} 页，第一周读了全书的 ${a}/${b}，第二周读的页数是第一周的 ${c}/${dd}。第二周读了多少页？（填数）`,
    ans:String(v),unit:u,kp:k,app:1,
    exp:`先求第一周：${W}×${a}/${b}=${W*a/b}（页）；再求第二周：${W*a/b}×${c}/${dd}=${v}（页）。连续求几分之几，一步一算。`};
},
f1_int_money:function(u,k){
  var d=pick([2,5]),n=1+R(d-1);
  var c=(d===2)?pick([4,6,8,10]):pick([5,10]);
  return{q:`一本手工册 ${n}/${d} 元，买 ${c} 本一共多少元？（填数）`,
    ans:String(n*c/d),unit:u,kp:k,app:1,
    exp:`单价×数量：${n}/${d}×${c}=${n*c/d}（元）。分数乘整数，分子乘 c，分母不变。`};
},
f1_milk_half:function(u,k){
  var d=pick([4,5]),n=1+R(d-1),q=pick([2,4]),p=1;
  return{q:`一盒牛奶 ${n}/${d} 升，喝了它的 ${p}/${q}，喝了多少升？（填最简分数，单位：升）`,
    ans:frac(n*p,d*q),unit:u,kp:k,app:1,
    exp:`求一个数的几分之几用乘法：${n}/${d}×${p}/${q}=${frac(n*p,d*q)}（升）。`};
},
f1_class_boys:function(u,k){
  var pairs=[[20,3,5],[20,2,5],[30,3,5],[30,4,5],[36,3,4],[40,3,5],[40,3,4],[30,5,6]];
  var t=pick(pairs),total=t[0],p=t[1],q=t[2],boys=total*p/q;
  return{q:`六（1）班共有 ${total} 人，男生占全班人数的 ${p}/${q}。男生有多少人？（填数）`,
    ans:String(boys),unit:u,kp:k,app:1,
    exp:`求一个数的几分之几用乘法：${total}×${p}/${q}=${boys}（人）。女生则有 ${total}−${boys}=${total-boys}（人）。`};
},
f1_school_hours:function(u,k){
  var t=pick([[1,3,8],[3,8,9],[1,4,6],[5,8,15],[1,2,12]]);
  return{q:`一天有 24 小时，小星在校时间占全天的 ${t[0]}/${t[1]}。小星在校多少小时？（填数）`,
    ans:String(t[2]),unit:u,kp:k,app:1,
    exp:`24×${t[0]}/${t[1]}=${t[2]}（小时）。找准单位 1——"全天 24 小时"是单位 1。`};
},
f1_road2:function(u,k){
  var c=pick([4,5]),a=c*pick([40,60,80]),b=pick([2,3]),day2=a*b/c;
  return{q:`修路队第一天修了 ${a} 米，第二天修的是第一天的 ${b}/${c}。两天一共修了多少米？（填数）`,
    ans:String(a+day2),unit:u,kp:k,app:1,
    exp:`先求第二天：${a}×${b}/${c}=${day2}（米）；再相加：${a}+${day2}=${a+day2}（米）。`};
},

/* —— 第二单元 可能性 —— */
f2_certain:function(u,k){
  var t=pick([
    {box:'盒子里全是红球',ask:'摸出一个红球',ans:'一定发生',why:'盒子里只有红球，闭着眼也肯定是红球。'},
    {box:'盒子里有 5 个红球和 3 个黄球',ask:'摸出一个黄球',ans:'可能发生',why:'有黄球就可能摸到，但红球多，不一定会摸到黄球。'},
    {box:'盒子里全是蓝球',ask:'摸出一个黄球',ans:'不可能发生',why:'根本没有黄球，怎么摸都摸不到。'},
    {box:'盒子里有 1 个红球和 9 个黄球',ask:'摸出一个红球',ans:'可能发生',why:'只有 1 个红球，可能性很小，但不是 0！小 ≠ 不可能。'}]);
  return{q:`${t.box}。随便摸一个球，"摸出${t.ask.replace('一个','')}这件事"会怎样？`,
    ops:shuffle(['一定发生','可能发生','不可能发生']),ans:t.ans,unit:u,kp:k,
    exp:t.why};
},
f2_size:function(u,k){
  var r=2+R(6),y=1+R(4),max=r===y?null:(r>y?'红球':'黄球');
  return{q:`盒子里有 ${r} 个红球和 ${y} 个黄球，随便摸一个。摸到哪种颜色球的可能性大？`,
    ops:shuffle(['红球','黄球','一样大']),ans:max||'一样大',unit:u,kp:k,
    exp:`谁数量多谁可能性大：红球 ${r} 个、黄球 ${y} 个，所以摸到${max||'两种球的可能性一样大'}${max?'的可能性大':''}。`};
},
f2_score:function(u,k){
  var total=pick([6,8,10]),red=0,yel=0;
  red=pick([2,3,4]);yel=total-red;
  var v=frac(red,total);
  return{q:`盒子里有 ${red} 个红球和 ${yel} 个黄球，随便摸一个。摸到红球的可能性是几分之几？（填最简分数）`,
    ans:v,unit:u,kp:k,app:1,
    exp:`可能性 = 红球数 ÷ 总球数 = ${red}/${total}，约分得 ${v}。`};
},
f2_turntable:function(u,k){
  var n=pick([4,6,8,10]),a=1+R(n-1);
  return{q:`一个转盘平均分成 ${n} 份，其中红色占 ${a} 份。转到红色的可能性是几分之几？（填最简分数）`,
    ans:frac(a,n),unit:u,kp:k,app:1,
    exp:`可能性 = 红色份数 ÷ 总份数 = ${a}/${n}，约分得 ${frac(a,n)}。`};
},
f2_dice:function(u,k){
  var t=pick([['大于 4 的点数',2,'1/3'],['单数（1、3、5）',3,'1/2'],['小于 3 的点数',2,'1/3'],['恰好是 6 点',1,'1/6'],['双数（2、4、6）',3,'1/2']]);
  return{q:`掷一个骰子（六个面分别是 1～6 点）。掷出"${t[0]}"的可能性是几分之几？（填最简分数）`,
    ans:t[2],unit:u,kp:k,app:1,
    exp:`骰子共有 6 种等可能结果，满足"${t[0]}"的有 ${t[1]} 种 → ${t[1]}/6，约分得 ${t[2]}。`};
},
f2_cards:function(u,k){
  var t=pick([['2 的倍数',10,'1/2'],['5 的倍数',4,'1/5'],['3 的倍数',6,'3/10'],['4 的倍数',5,'1/4']]);
  return{q:`写着 1～20 的 20 张卡片背面朝上，随便抽一张。抽到"${t[0]}"的卡片的可能性是几分之几？（填最简分数）`,
    ans:t[2],unit:u,kp:k,app:1,
    exp:`1～20 中"${t[0]}"有 ${t[1]} 张 → ${t[1]}/20，约分得 ${t[2]}。`};
},
f2_expect:function(u,k){
  var t=pick([[1,2,3,30,10],[2,1,3,60,40],[1,3,4,40,10],[3,1,4,40,30],[1,5,6,60,10],[5,1,6,30,25]]);
  return{q:`盒子里有 ${t[0]} 个红球和 ${t[1]} 个黄球（除颜色外都相同），搅匀后每次摸出一个、放回再摸。像这样摸 ${t[3]} 次，大约能摸到红球多少次？（填数）`,
    ans:String(t[4]),unit:u,kp:k,app:1,
    exp:`摸到红球的可能性是 ${t[0]}/${t[0]+t[1]}（约分），${t[3]}×${t[0]}/${t[0]+t[1]}=${t[4]}（次）。"大约"是估算，实际次数会上下浮动。`};
},
f2_experiment:function(u,k){
  var t=pick([[1,3,20,5],[1,4,40,8],[3,5,20,12],[2,3,30,12],[1,2,50,25],[3,7,20,6]]);
  return{q:`盒子里有 ${t[0]} 个红球和 ${t[1]} 个黄球（除颜色外都相同）。小明每次摸出一个球，记录颜色后放回搅匀，共摸了 ${t[2]} 次，摸到红球大约多少次？（填数）`,
    ans:String(t[3]),unit:u,kp:k,app:1,
    exp:`摸到红球的可能性 = ${t[0]}/${t[0]+t[1]}，${t[2]} × ${t[0]}/${t[0]+t[1]} = ${t[3]}（次）。实验次数越多，实际统计结果越接近这个数。`};
},

/* —— 第三单元 分数除法 —— */
f3_recip:function(u,k){
  var a=pick([2,3,4,5]),b=pick([3,4,5,7,8]);
  return{q:`${a}/${b} 的倒数是多少？（填分数）`,ans:frac(b,a),unit:u,kp:k,
    exp:`互为倒数的两个数乘积是 1：${a}/${b} × ${b}/${a} = 1，所以倒数是 ${b}/${a}。分子分母换位置就行。`};
},
f3_div:function(u,k){
  var b=pick([2,3,4,5]),a=1+R(b-1),cc=pick([1,2,3]),dd=pick([2,3,4,5]);
  var v=frac(a*dd,b*cc);
  return{q:`计算：${a}/${b} ÷ ${cc}/${dd} = ？（填最简分数或整数）`,ans:v,unit:u,kp:k,
    exp:`除以一个数等于乘它的倒数：${a}/${b} ÷ ${cc}/${dd} = ${a}/${b} × ${dd}/${cc} = ${a*dd}/${b*cc}，约分得 ${v}。`};
},
f3_find_whole:function(u,k){
  var d=pick([3,4,5]),n=pick([2,3]);
  var whole=d*n*pick([2,3,4,5]);
  var part=whole*n/d;
  return{q:`一部儿童电影长 ${part} 分钟，正好是另一部纪录片的 ${n}/${d}。纪录片长多少分钟？（填数）`,
    ans:String(whole),unit:u,kp:k,app:1,
    exp:`单位 1（纪录片）未知，用除法：${part} ÷ ${n}/${d} = ${part} × ${d}/${n} = ${whole}（分钟）。对应关系：${part} 分钟 ↔ ${n}/${d}。`};
},
f3_div_err:function(u,k){
  var b=pick([2,3]),dd=pick([2,3,4]),a=1+R(3),cc=1+R(2);
  var good=frac(a*dd,b*cc);
  /* 候选干扰项：忘颠倒、多乘分母、分子加一等，去重保底 */
  var cands=[good,frac(a*cc,b*dd),frac(a*dd,b*cc*2),frac(a*dd+1,b*cc),frac(a*dd,b*cc+1)];
  var uniq=[];
  cands.forEach(function(x){if(uniq.length<4&&uniq.indexOf(x)<0)uniq.push(x)});
  while(uniq.length<3){var t2=frac(a*dd+uniq.length+1,b*cc);if(uniq.indexOf(t2)<0)uniq.push(t2)}
  return{q:`易错选择题：${a}/${b} ÷ ${cc}/${dd} = ？`,
    ops:shuffle(uniq),ans:good,unit:u,kp:k,
    exp:`正确：除号变乘号、除数翻跟头 → ${a}/${b} × ${dd}/${cc} = ${good}。常见错误是忘了把除数颠倒，或除号变了乘数没翻。`};
},

f3_daily_read:function(u,k){
  var t=pick([[4,2,3],[6,1,2],[5,1,3],[8,2,5]]);
  return{q:`小浩 ${t[0]} 天看了这本书的 ${t[1]}/${t[2]}。平均每天看这本书的几分之几？（填最简分数）`,
    ans:frac(t[1],t[2]*t[0]),unit:u,kp:k,app:1,
    exp:`每天看的 = 总分率 ÷ 天数：${t[1]}/${t[2]} ÷ ${t[0]} = ${t[1]}/${t[2]*t[0]}，约分得 ${frac(t[1],t[2]*t[0])}。`};
},
f3_paper_share:function(u,k){
  var a=pick([3,5]),b=pick([4,6,8]),c=pick([3,4]);
  return{q:`把 ${a}/${b} 米长的彩带平均剪成 ${c} 段，每段多少米？（填最简分数，单位：米）`,
    ans:frac(a,b*c),unit:u,kp:k,app:1,
    exp:`平均分用除法：${a}/${b} ÷ ${c} = ${a}/${b*c}，约分得 ${frac(a,b*c)}（米）。`};
},
f3_milk_cups:function(u,k){
  var a=pick([2,3]),b=pick([3,4]),c=pick([4,6]);
  return{q:`把 ${a}/${b} 升牛奶平均倒进 ${c} 个杯子里，每个杯子倒多少升？（填最简分数，单位：升）`,
    ans:frac(a,b*c),unit:u,kp:k,app:1,
    exp:`${a}/${b} ÷ ${c} = ${a}/${b*c}，约分得 ${frac(a,b*c)}（升）。除以整数等于乘 1/${c}。`};
},
f3_print_time:function(u,k){
  var t=pick([[3,3,17],[4,4,21],[6,6,25],[2,1,7],[5,5,16]]);
  return{q:`王阿姨打印一份文件，${t[0]} 分钟打印了这份文件的 ${t[1]}/${t[2]}。照这样计算，打完这份文件一共要多少分钟？（填数）`,
    ans:String(t[0]*t[2]/t[1]),unit:u,kp:k,app:1,
    exp:`打完全文时间 = ${t[0]} ÷ ${t[1]}/${t[2]} = ${t[0]} × ${t[2]}/${t[1]} = ${t[0]*t[2]/t[1]}（分钟）。"照这样计算"就是效率不变。`};
},
f3_rope_total:function(u,k){
  var t=pick([[15,5,8],[12,3,4],[18,3,8],[20,4,5],[16,2,5]]);
  var whole=t[0]*t[2]/t[1];
  return{q:`一根绳子用去了 ${t[1]}/${t[2]}，用去的部分长 ${t[0]} 米。这根绳子全长多少米？（填数）`,
    ans:String(whole),unit:u,kp:k,app:1,
    exp:`单位 1（全长）未知用除法：${t[0]} ÷ ${t[1]}/${t[2]} = ${t[0]} × ${t[2]}/${t[1]} = ${whole}（米）。`};
},
f3_bucket:function(u,k){
  var t=pick([[4,2,5],[6,3,5],[8,2,3],[9,3,4],[5,1,4]]);
  var whole=t[0]*t[2]/t[1];
  return{q:`一桶油，倒出了 ${t[1]}/${t[2]}，正好倒了 ${t[0]} 千克。这桶油原来重多少千克？（填数）`,
    ans:String(whole),unit:u,kp:k,app:1,
    exp:`倒出的 ${t[0]} 千克对应 ${t[1]}/${t[2]}，求单位 1：${t[0]} ÷ ${t[1]}/${t[2]} = ${whole}（千克）。`};
},

/* —— 第四单元 比 —— */
f4_simplify:function(u,k){
  var g=pick([2,3,4,6,12]),a=g*(2+R(4)),b=g*(1+R(3));
  if(a===b){b=b+g}
  return{q:`化简比：${a} : ${b} = ？（按 a : b 的形式填）`,ans:frac(a,g)+':'+frac(b,g),ratio:1,unit:u,kp:k,
    exp:`前项后项同除以最大公因数 ${g}：${a}÷${g}=${a/g}，${b}÷${g}=${b/g} → ${a/g} : ${b/g}。`};
},
f4_value:function(u,k){
  var t=pick([[6,4],[8,6],[10,4],[9,6],[15,9]]);
  var v=frac(t[0],t[1]);
  return{q:`求比值：${t[0]} : ${t[1]} = ？（填分数、小数或整数）`,ans:v,unit:u,kp:k,
    exp:`比值 = 前项 ÷ 后项 = ${t[0]} ÷ ${t[1]} = ${v}。注意：求比值结果是数，不带单位、不写成比的形式。`};
},
f4_share:function(u,k){
  var r1=pick([3,5]),r2=pick([2,4]),per=pick([4,5,6,8]),T=(r1+r2)*per;
  return{q:`把 ${T} 颗糖果按 ${r1} : ${r2} 分给哥哥和妹妹，哥哥分到多少颗？（填数）`,
    ans:String(r1*per),unit:u,kp:k,app:1,
    exp:`总份数 ${r1}+${r2}=${r1+r2}，每份 ${T}÷${r1+r2}=${per} 颗，哥哥拿 ${r1} 份：${per}×${r1}=${r1*per}（颗）。`};
},
f4_share_app:function(u,k){
  var r1=5,r2=3,T=pick([32,40,48]),per=T/(r1+r2),red=r1*per;
  return{q:`盒子里红球和黄球共 ${T} 个，红球与黄球个数比是 5 : 3。红球有多少个？（填数）`,
    ans:String(red),unit:u,kp:k,app:1,
    exp:`总份数 5+3=8，每份 ${T}÷8=${per} 个，红球 5 份：${per}×5=${red}（个）。`};
},
f4_share_app:function(u,k){
  var r1=5,r2=3,T=pick([32,40,48]),per=T/(r1+r2),red=r1*per;
  return{q:`盒子里红球和黄球共 ${T} 个，红球与黄球个数比是 5 : 3。红球有多少个？（填数）`,
    ans:String(red),unit:u,kp:k,app:1,
    exp:`总份数 5+3=8，每份 ${T}÷8=${per} 个，红球 5 份：${per}×5=${red}（个）。`};
},
f4_sugar_water:function(u,k){
  var t=pick([[1,10,440],[1,10,550],[1,11,480],[2,9,330]]);
  var per=t[2]/(t[0]+t[1]);
  return{q:`按糖和水 ${t[0]} : ${t[1]} 的质量比，调制一杯 ${t[2]} g 的糖水。需要糖多少克？（填数）`,
    ans:String(per*t[0]),unit:u,kp:k,app:1,
    exp:`总份数 ${t[0]}+${t[1]}=${t[0]+t[1]}，每份 ${t[2]}÷${t[0]+t[1]}=${per} g，糖 ${t[0]} 份：${per}×${t[0]}=${per*t[0]}（g）。`};
},
f4_salt_water:function(u,k){
  var t=pick([[3,17,500],[1,24,500],[2,13,450],[5,15,400]]);

f5_ring:function(u,k){

},

/* —— 第一单元补充：单位换算 / 比大小 / 连乘传递 / 比多比少 / 剩料 / 面积差 —— */
f1_unit_conv:function(u,k){
  var t=pick([[1,4,60,'时','分',15],[1,2,24,'日','时',12],[9,10,1000,'吨','千克',900],
    [2,5,10,'米','分米',4],[7,8,10000,'公顷','平方米',8750],[1,4,100,'平方分米','平方厘米',25],
    [3,5,60,'分','秒',36],[3,4,1000,'千克','克',750]]);
  return{q:`${t[0]}/${t[1]} ${t[3]} = （　）${t[4]}（填数）`,ans:String(t[5]),unit:u,kp:k,
    exp:`单位换算用乘法：1 ${t[3]} = ${t[2]} ${t[4]}，所以 ${t[0]}/${t[1]} × ${t[2]} = ${t[5]}（${t[4]}）。分数乘整数也能解决单位换算。`};

f1_compare_size:function(u,k){
  var b=pick([4,5,8,10]),a=1+R(b-1),mode=R(3),leftTxt,ans;

  else{leftTxt=a+'/'+b+' × 1';ans='='}
  return{q:`在○里填上">"、"<"或"="：${leftTxt} ○ ${a}/${b}`,
    ops:shuffle(['>','<','=']),ans:ans,unit:u,kp:k,
    exp:`不用硬算：一个数乘大于 1 的数，积变大；乘 1，积不变；乘真分数（小于 1 的数），积变小。先看乘的数和 1 比大小。`};
},
f1_triple_chain:function(u,k){
  var t=pick([[240,5,8,2,3],[360,5,6,2,3],[480,3,8,2,3],[240,2,3,3,4],[360,2,3,1,2],[400,5,8,3,5]]);
  var second=t[0]*t[1]/t[2],third=second*t[3]/t[4];
  return{q:`三名同学跳绳，小芳跳了 ${t[0]} 下，小红跳的是小芳的 ${t[1]}/${t[2]}，小凡跳的是小红的 ${t[3]}/${t[4]}。小凡跳了多少下？（填数）`,
    ans:String(third),unit:u,kp:k,app:1,

},
f1_more_less:function(u,k){

    [1200,4,5,43,'植物园花展摆了 1200 盆郁金香，摆的月季数量比郁金香的 4/5 多 43 盆。月季摆了多少盆？','盆'],
    [2384,3,8,-77,'图书馆有文学书 2384 本，科普书的数量比文学书的 3/8 少 77 本。科普书有多少本？','本'],
    [3600,5,9,45,'玩具厂计划生产 3600 件玩具，实际比计划的 5/9 多 45 件。实际生产了多少件？','件']]);

f1_steel_left:function(u,k){

f2_spinner_mini:function(u,k){

f2_paint_design:function(u,k){

/* —— 第三单元补充：方程 / 剩余分率 / 降价 / 行程 / 双单位1 / 叠纸 / 速度比 —— */
f3_solve_equation:function(u,k){

f3_tunnel_two:function(u,k){

},
f3_swim_run:function(u,k){

  return{q:`无脊椎动物中墨鱼游得最快，${t[0]}/${t[1]} 小时可以游 ${t[2]} 千米；脊椎动物中猎豹跑得最快，${t[3]}/${t[4]} 小时可以跑 ${t[5]} 千米。墨鱼游动的速度是猎豹奔跑速度的几分之几？（填最简分数）`,

/* —— 第四单元补充：效率比 / 速度比 / 存粮比 / 调人相等 / 溶液混合（周计划经典）—— */
f4_work_ratio:function(u,k){
  var t=pick([[8,10],[6,10],[12,8],[10,6]]);
  var g=gcd(t[0],t[1]);
  return{q:`甲 ${t[0]} 天的工作量正好与乙 ${t[1]} 天的工作量相等，甲、乙的工作效率之比是多少？（按 a : b 的形式填）`,
    ans:(t[1]/g)+':'+(t[0]/g),ratio:1,unit:u,kp:k,
    exp:`把总工作量看作 1：甲每天做 1/${t[0]}，乙每天做 1/${t[1]}。效率比 = 1/${t[0]} : 1/${t[1]} = ${t[1]} : ${t[0]}，化简得 ${t[1]/g} : ${t[0]/g}。工作量相同时，效率和天数成反比。`};
},
f4_speed_time_ratio:function(u,k){
  var t=pick([[6,4],[8,6],[10,8],[9,6]]);
  var g=gcd(t[0],t[1]);
  return{q:`一辆客车沿同一条路线行驶，原来需要 ${t[0]} 小时，提速后现在只要 ${t[1]} 小时。现在的速度与原来的速度之比是多少？（按 a : b 的形式填）`,
    ans:(t[0]/g)+':'+(t[1]/g),ratio:1,unit:u,kp:k,
    exp:`路程相同，速度与时间成反比：速度比 = 原时间 : 现时间 = ${t[0]} : ${t[1]}，化简得 ${t[0]/g} : ${t[1]/g}。时间越短，速度越快。`};
},
f4_granary_ratio:function(u,k){
  var t=pick([[3,4,2,3],[2,5,3,4],[3,5,2,3],[4,7,3,5]]);
  var num=t[2]*t[1],den=t[3]*t[0],g=gcd(num,den);
  return{q:`甲仓库存粮的 ${t[0]}/${t[1]} 和乙仓库存粮的 ${t[2]}/${t[3]} 相等，甲、乙两仓库存粮数量之比是多少？（按 a : b 的形式填）`,
    ans:(num/g)+':'+(den/g),ratio:1,unit:u,kp:k,
    exp:`设相等的量都是 1，则甲 = ${t[1]}/${t[0]}，乙 = ${t[3]}/${t[2]}。甲 : 乙 = ${t[1]}/${t[0]} : ${t[3]}/${t[2]} = ${num} : ${den}，化简得 ${num/g} : ${den/g}。`};
},
f4_move_equal:function(u,k){
  var d=pick([6,8,5]);
  return{q:`把甲班人数的 1/${d} 调到乙班，则两班人数相等。原来甲班与乙班的人数之比是多少？（按 a : b 的形式填）`,
    ans:d+':'+(d-2),ratio:1,unit:u,kp:k,
    exp:`甲班调出 1/${d} 后两队相等 → 乙班原来比甲班少 2×1/${d} = 2/${d} → 乙 = 甲的 ${frac(d-2,d)}。所以甲 : 乙 = ${d} : ${d-2}。`};
},
f4_alcohol_mix:function(u,k){
  var t=pick([[3,1,2,1],[5,1,3,1],[4,1,1,1],[7,1,5,2]]);
  var s1=t[0]+t[1],s2=t[2]+t[3],V=s1*s2/gcd(s1,s2);
  var alc=t[0]*V/s1+t[2]*V/s2,wat=t[1]*V/s1+t[3]*V/s2,g=gcd(alc,wat);
  return{q:`两个容积相同的瓶中装满了酒精溶液，一个瓶中酒精与水的体积之比是 ${t[0]} : ${t[1]}，另一个瓶中是 ${t[2]} : ${t[3]}。把两瓶溶液混合，混合溶液中酒精与水的体积之比是多少？（按 a : b 的形式填）`,
    ans:(alc/g)+':'+(wat/g),ratio:1,unit:u,kp:k,
    exp:`设每瓶容积为 ${V}：第一瓶酒精 ${t[0]*V/s1}、水 ${t[1]*V/s1}；第二瓶酒精 ${t[2]*V/s2}、水 ${t[3]*V/s2}。混合后酒精共 ${alc}、水共 ${wat} → ${alc} : ${wat}，化简得 ${alc/g} : ${wat/g}。`};
},

/* —— 第五单元补充：绕树绳 / 剪最大圆 / 骑车 / 栽树 / 石子路 / 起跑线 —— */

f5_bike_ride:function(u,k){

function genPool(unitId,level){
  var out=[];
  UNITS.forEach(function(un){
    if(unitId&&unitId!==8&&un.id!==unitId)return;
    if(unitId===8&&un.id===8)return;   /* 总复习=前七单元混合 */
    un.kps.forEach(function(kp){
      kp.gens.forEach(function(g){
        if(!GENS[g])return;
        if(level&&GENLVL[g]!==level)return;
        out.push({g:g,u:un.id,k:kp.id});
      });
    });
  });
  return out;
}
function makeQ(spec){
  var q=GENS[spec.g](spec.u,spec.k);
  q.lvl=GENLVL[spec.g]||2;
  return q;
}
/* 难度混合策略：易30% 中50% 挑战20% */
function mixPool(unitId,n){
  var out=[],tries=0;
  while(out.length<n&&tries<n*30){
    tries++;
    var r=Math.random(),lv=r<0.3?1:(r<0.8?2:3);
    var pool=genPool(unitId,lv);
    if(!pool.length)pool=genPool(unitId,0);
    var spec=pick(pool);
    if(out.length&&out[out.length-1].g===spec.g&&tries<n*15)continue;
    out.push(spec);
  }
  return out;
}

/* 导航名 → 权限模块（quiz 属于触发它的模块，不单独限权） */
var PERM_ROUTE={units:'units',unit:'units',gen:'gen',wrong:'wrong',place:'place',map:'map',board:'board',cheat:'cheat',four:'four',report:'report'};
function curUser(){return CUR?findUser(CUR.phone):null}  /* 实时取用户最新状态（含封禁/权限） */
function hasPerm(mod){
  var u=curUser();
  if(!u)return false;
  if(u.role==='admin')return true;
  if(!u.perms)return true;   /* 未设置过权限 = 全部允许 */
  return u.perms[mod]!==false;
}
function isBanned(){var u=curUser();return !!(u&&u.banned)}

function go(name,arg){
  if(window._autoTimer){clearInterval(window._autoTimer);window._autoTimer=null}
  /* 管理员视图保护：普通用户不可达 */
  if((name==='admin'||name==='userAdmin')&&!isAdmin()){CUR=CUR;window.scrollTo(0,0);VIEWS.noPerm();return}
  /* 封禁检查：实时读用户表，封禁后即使在线也会被踢出 */
  var cu=CUR?findUser(CUR.phone):null;
  if(cu&&cu.banned){
    var bu=cu;CUR=null;lsRm(CKEY);S=load();
    window.scrollTo(0,0);VIEWS.bannedView(bu);return;
  }
  /* 模块权限检查（管理员豁免） */
  var pm=PERM_ROUTE[name];
  if(pm&&!hasPerm(pm)){window.scrollTo(0,0);VIEWS.noPerm();return}
  window.scrollTo(0,0);VIEWS[name](arg);
}

VIEWS.userAdmin=function(phone){

  var h=`<div class="topbar"><button class="backbtn" onclick="go('admin')">‹ 面板</button><h1>⚙ 用户管理</h1></div>
  <div class="card"><h2>${u.name}（${u.phone}）</h2>

      <button class="btn" style="width:100%;background:#C0392B;border-color:#C0392B" onclick="doBan('${phone}')">⛔ 确认封禁</button>`;

    <p class="muted" style="font-size:13px">取消勾选 = 该账号首页隐藏此模块且无法进入（AI 判分关闭后应用题只按最终答案判分）。全部勾选 = 全功能。</p>

      <span>${p.icon} ${p.name}</span>

  });

    <button class="btn" style="width:100%;margin-top:10px" onclick="savePerms('${phone}')">💾 保存授权</button>
    <button class="btn plain" style="width:100%;margin-top:8px" onclick="grantAllPerms()">✅ 全部勾选（恢复全功能）</button>
    <div id="permMsg" style="min-height:18px;font-size:13px;font-weight:700;color:var(--green);margin-top:6px"></div></div>`;

      gradePhoto(q,user,window._photoData,function(res){

/* 拍照上传：压缩图片并预览（手机拍的照片可达数 MB，base64 前必须压缩） */
function handlePhoto(inp){
  var f=inp.files&&inp.files[0];
  if(!f)return;
  try{
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();
      img.onload=function(){
        try{
          var max=1280,w=img.width||max,h=img.height||max;
          if(w>max||h>max){var k=Math.min(max/w,max/h);w=Math.round(w*k);h=Math.round(h*k)}
          var c=document.createElement('canvas');c.width=w;c.height=h;
          c.getContext('2d').drawImage(img,0,0,w,h);
          window._photoData=c.toDataURL('image/jpeg',0.8);
        }catch(e){window._photoData=rd.result}  /* canvas 不可用时用原图 */
        var pv=document.getElementById('photoPrev');
        if(pv)pv.innerHTML='<img src="'+window._photoData+'" style="max-width:100%;max-height:180px;border-radius:8px;border:1px solid var(--line)"><p class="muted" style="font-size:12px">✓ 照片已就绪（约 '+Math.round(window._photoData.length/1365)+' KB），提交答案后 AI 会识别图中的解题过程</p>';
      };
      img.onerror=function(){window._photoData=rd.result;
        var pv=document.getElementById('photoPrev');
        if(pv)pv.innerHTML='<p class="muted" style="font-size:12px">✓ 照片已就绪，提交答案后 AI 会识别</p>';};
      img.src=rd.result;
    };
    rd.readAsDataURL(f);
  }catch(e){
    var m=document.getElementById('photoPrev');
    if(m)m.innerHTML='<p class="muted" style="font-size:12px;color:#C0392B">✕ 照片读取失败：'+e.message+'</p>';
  }
}
/* 从多行过程作答中提取最终数值（支持分数/小数/百分数；优先"答："行） */
function extractFinal(text){
  var s=String(text||'');
  var m=s.match(/答\s*[：:][^\n\d\-]*(-?\d+(?:\.\d+)?(?:\/\d+)?)\s*(?:%|（[^）]*）)?/);
  if(m)return m[1];
  var nums=s.match(/-?\d+(?:\.\d+)?(?:\/\d+)?%?/g);
  if(!nums)return null;
  var last=nums[nums.length-1];
  return /%$/.test(last)?last.replace(/%$/,''):last;
}
/* 本地预判：ok=最终答案数值正确 / mismatch=数值不一致 / none=提不出数值 */
function procLocalGrade(q,text){
  var v=extractFinal(text);
  if(v===null)return {level:'none'};
  var uv=val(v),cv=val(q.ans);
  if(uv===null||cv===null)return {level:'none'};
  return {level:Math.abs(uv-cv)<1e-9?'ok':'mismatch'};
}

      :'只输出一行 JSON：{"correct": true 或 false, "feedback": "点评"}');
  var msgContent=photo
    ?[{type:'text',text:prompt},{type:'image_url',image_url:{url:photo}}]
    :prompt;
  return fetch(cfg.endpoint,{method:'POST',
    headers:{'Content-Type':'application/json',Authorization:'Bearer '+cfg.key},
    body:JSON.stringify({model:cfg.model,messages:[{role:'user',content:msgContent}],temperature:0,max_tokens:photo?500:300})})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(j){
    var txt=(j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content)||'';

    var obj=m?JSON.parse(m[0]):null;
    if(!obj||typeof obj.correct!=='boolean')throw new Error('AI 返回格式异常');
    return {correct:!!obj.correct,feedback:String(obj.feedback||'').slice(0,150),recognized:photo?String(obj.recognized||'').slice(0,300):null};
  });
}

function gradeAnswer(q,user,cb){

  if(!hasPerm('ai')){
    var msg0=local.level==='mismatch'?'按最终答案判定为不正确。':'未授权 AI 判分。请至少写明最终答案（如「答：48 平方米」）。';
    return cb({correct:false,feedback:msg0});
  }
  var cfg=getAIcfg();
  if(!cfg||!cfg.endpoint||!cfg.key||!cfg.model){
    var msg=local.level==='mismatch'
      ?'按最终答案判定为不正确。'
      :'AI 判分暂不可用，无法识别过程性作答。请至少写明最终答案（如「答：48 平方米」）。';
    return cb({correct:false,feedback:msg});

    .then(function(r){cb(r)})
    .catch(function(e){

    if(!GENS[g])return;
    var test=GENS[g](u.id,kp.id);if(test.app)appGens.push({g:g,u:u.id,k:kp.id});
  })})});
  var qs=[];for(var i=0;i<8;i++){qs.push(makeQ(pick(appGens)))}
  startQuiz(qs,'gen','应用题四步法特训',function(){
    var arr=[];for(var i=0;i<8;i++){arr.push(makeQ(pick(appGens)))}
    return arr;
  });
}

/* —— 家长报告 —— */
VIEWS.report=function(){
  if(!CUR){go('home');return}
  var h=`<div class="topbar"><button class="backbtn" onclick="go('home')">‹ 首页</button><h1>📊 学习报告</h1></div>
  <div class="card"><h2>${CUR.name}（${CUR.phone}）的进度</h2><table class="rep"><tr><th>单元</th><th>练习</th><th>正确率</th><th>状态</th></tr>`;
  UNITS.forEach(function(u){
    var s=S.st[u.id]||{att:0,cor:0};
    var r=s.att?Math.round(s.cor/s.att*100):null;
    var st=r===null?'<span class="muted">未开始</span>':(r>=80?'👍 稳':(r>=60?'💪 练':'⚠ 弱'));
    h+=`<tr><td style="text-align:left">${u.id} ${u.name}</td><td>${s.att}</td><td>${r===null?'—':r+'%'}</td><td>${st}</td></tr>`;
  });
  h+='</table></div>';
  var weak=UNITS.filter(function(u){var s=S.st[u.id];return s&&s.att>=5&&s.cor/s.att<0.6});
  h+=`<div class="card"><h2>💡 给家长的话</h2>`;
  if(weak.length){
    h+='<p style="font-size:14px">这几个单元正确率低于 60%，建议先回去读知识卡、再点"过关检验"：<b>'+weak.map(function(u){return u.id+'·'+u.name}).join('、')+'</b></p>';
  }else if(!S.wrong.length&&!Object.keys(S.st).length){
    h+='<p class="muted">还没有练习记录。建议先做"两分钟摸底"，看看从哪个单元入手。</p>';
  }else h+='<p class="muted" style="font-size:14px">各单元表现平稳。保持每天 10 分钟，错题隔日重考别忘了。</p>';
  var due=dueWrongCount();
  if(due)h+=`<p style="font-size:14px;margin-top:6px">📕 今天有 <b>${due}</b> 道错题到期，花 3 分钟清掉。</p>`;
  h+='</div>';
  var last7=[],dd=new Date();
  for(var i=6;i>=0;i--){var d2=new Date();d2.setDate(d2.getDate()-i);
    var k=d2.getFullYear()+'-'+String(d2.getMonth()+1).padStart(2,'0')+'-'+String(d2.getDate()).padStart(2,'0');
    last7.push(S.days[k]?S.days[k].att:0)}
  var maxA=Math.max.apply(null,last7.concat([1]));
  h+=`<div class="card"><h2>最近 7 天练习量</h2><div style="display:flex;align-items:flex-end;gap:6px;height:70px;padding-top:8px">`;
  last7.forEach(function(a,i){
    h+=`<div style="flex:1;text-align:center"><div style="background:var(--green);height:${Math.max(3,a/maxA*50)}px;border-radius:4px 4px 0 0"></div><span class="muted" style="font-size:10px">${a}</span></div>`;
  });
  h+='</div></div>';
  app.innerHTML=h;
};
