<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>数学乐园 · 青岛版六三制（1-6年级12册）</title>
<meta name="app-version" content="v3.11.0-fourlv-1">
<style>
:root{
  --bg:#F7F4EC; --card:#FFFFFF; --ink:#3A352B; --sub:#8A8474;
  --green:#2E6B4F; --greenL:#EAF2ED; --orange:#E8833A; --orangeL:#FDF1E6;
  --blue:#3A6EA5; --blueL:#EAF1F8; --red:#C0392B; --redL:#FBEAE7;
  --gold:#B8860B; --line:#E5E0D2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.7}
.wrap{max-width:560px;margin:0 auto;padding:14px 14px 60px}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.backbtn{border:none;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-size:15px;font-weight:700;color:var(--ink);cursor:pointer}
.topbar h1{font-size:19px;flex:1}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:14px;border:1.5px solid var(--line)}
.card h2{font-size:17px;margin-bottom:8px}
.card h3{font-size:15.5px;margin:10px 0 6px}
.muted{color:var(--sub);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.modbtn{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center;cursor:pointer;font-weight:800;font-size:15px}
.modbtn small{display:block;font-weight:400;color:var(--sub);font-size:11.5px;margin-top:3px}
.modbtn:active{transform:scale(.97)}
.unitbtn{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.unitbtn .no{width:38px;height:38px;border-radius:12px;color:#fff;font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.unitbtn .tt{flex:1}
.unitbtn .tt b{font-size:15.5px}
.unitbtn .tt small{display:block;color:var(--sub);font-size:12px}
.badge{background:var(--greenL);color:var(--green);border-radius:8px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.badge.gray{background:#EFECE3;color:var(--sub)}
.kp{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--card)}
.kp.lit{border-color:var(--green);background:var(--greenL)}
.kp .head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15.5px}
.kp .head .dot{width:22px;height:22px;border-radius:50%;background:#E8E4D8;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.kp.lit .head .dot{background:var(--green);color:#fff}
.btn{display:inline-block;border:none;border-radius:12px;padding:11px 22px;font-size:15.5px;font-weight:800;cursor:pointer;color:#fff;background:var(--green)}
.btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}
.btn.plain{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45}
.qstem{font-size:19px;font-weight:800;margin:14px 0;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:16.5px;font-weight:700;margin-bottom:10px;cursor:pointer}
.opt:active{background:var(--greenL)}
.opt.right{border-color:var(--green);background:var(--greenL)}
.opt.wrong{border-color:var(--red);background:var(--redL)}
input.ansin{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;background:var(--card);color:var(--ink);outline:none}
input.ansin:focus{border-color:var(--green)}
/* v3.3.1：textarea 之前没有匹配 input.ansin 选择器，样式缺失且无 focus 反馈（孩子点了看不出是否聚焦） */
textarea.ansin{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;font-size:18px;font-weight:700;background:var(--card);color:var(--ink);outline:none;resize:vertical;font-family:inherit;caret-color:var(--green)}
textarea.ansin:focus{border-color:var(--blue) !important;box-shadow:0 0 0 4px rgba(62,155,240,.15)}
.fb{border-radius:14px;padding:13px 15px;margin-top:12px;font-size:14.5px;display:none}
.fb.ok{display:block;background:var(--greenL);color:var(--green);border:1.5px solid #BFDCCB}
.fb.no{display:block;background:var(--redL);color:var(--red);border:1.5px solid #EBBDB6}
.fb b{font-size:15px}
.exbox{background:var(--blueL);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.exambox{background:var(--orangeL);border-radius:12px;padding:10px 12px;margin:8px 0;font-size:14px}
.tag{display:inline-block;border-radius:8px;padding:2px 9px;font-size:12px;font-weight:800;color:#fff;margin-right:6px}
.statrow{display:flex;justify-content:space-between;padding:7px 2px;border-bottom:1px dashed var(--line);font-size:14.5px}
.bar{height:8px;border-radius:4px;background:#EFECE3;overflow:hidden;flex:1;margin:0 10px}
.bar i{display:block;height:100%;background:var(--green)}
table.rep{width:100%;border-collapse:collapse;font-size:13.5px}
table.rep th,table.rep td{border-bottom:1px solid var(--line);padding:7px 4px;text-align:center}
table.rep th{color:var(--sub);font-weight:700}
h2.sec{font-size:18px;margin:4px 0 12px}
.step{display:flex;gap:10px;margin-bottom:12px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pctchip{display:inline-block;background:var(--orangeL);color:var(--orange);border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;margin:2px 4px 2px 0}
.bigday{text-align:center;padding:18px 0 8px}
.bigday b{font-size:34px;color:var(--green)}
.cheat{border-bottom:1px solid var(--line);padding:10px 0}
.cheat b{color:var(--green)}
.footer-tip{text-align:center;color:var(--sub);font-size:12px;margin-top:18px}
.flash-ok{animation:fo .4s}
@keyframes fo{0%{background:#D8EDE0}100%{background:var(--greenL)}}
svg.map{width:100%;height:auto}
/* 教科书式分数：分子在上、分母在下、中间横线 */
.frac{display:inline-block;vertical-align:middle;text-align:center;margin:0 2px;line-height:1.05}
.frac .nu{display:block;padding:0 4px;border-bottom:1.6px solid currentColor}
.frac .de{display:block;padding:0 4px}
/* 密码输入行：显隐切换 */
.pwdwrap{position:relative}
.pwdwrap input{width:100%;padding-right:44px;box-sizing:border-box}
.pwd-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:none;background:none;font-size:18px;cursor:pointer;padding:4px;line-height:1;color:var(--sub)}
.qstem .frac{font-size:19px}
.opt .frac{font-size:16.5px;display:inline-block}
.kp .frac{font-size:14px}
.fb .frac{font-size:14px}

/* ═══════════════════════════════════════════════════════
   童趣设计系统 · 全局覆盖层（不改动上方任何原有规则）
   保留全部变量名与类名，只重定义外观；JS 与逻辑零改动
   ═══════════════════════════════════════════════════════ */

/* — 1. 调色板重定义：米白纸感 → 奶油蓝天乐园 — */
:root{
  --bg:#DFF3FF;        /* 天空蓝底 */
  --card:#FFFFFF;      /* 云朵白卡 */
  --ink:#37415C;       /* 深夜蓝墨（护眼、对比足） */
  --sub:#8794B8;       /* 柔和淡紫灰 */
  --green:#27A567;     /* 活力草绿（成功/主按钮） */
  --greenL:#E1F7EC;    /* 浅绿 */

  --orange:#FF8A3D;    /* 阳光橙（行动按钮） */
  --orangeL:#FFF0E2;   /* 浅橙 */

  --blue:#3E9BF0;      /* 晴空蓝（信息） */
  --blueL:#E3F1FF;     /* 浅蓝 */

  --red:#F0603F;       /* 番茄红（错误提示，柔和不过分吓人） */
  --redL:#FFE9E4;      /* 浅红 */

  --gold:#F5B325;      /* 星星金 */
  --line:#E4ECF7;      /* 冰蓝细线 */
  /* 童趣专用新增变量 */
  --purpleL:#F1EAFE;   /* 浅紫 */
  --purple:#9B6FE0;    /* 葡萄紫 */
  --pinkL:#FFEDF3;     /* 浅粉 */
  --pink:#FF7BAC;      /* 草莓粉 */
  --shadow:0 6px 0 rgba(55,65,92,.10);   /* 糖果下坠阴影 */
  --shadow-lg:0 8px 0 rgba(55,65,92,.12);
}

/* — 3. 卡片：云朵白卡 + 糖果阴影 — */
.card{
  border-radius:24px !important;
  border:2.5px solid #EAF2FC !important;
  box-shadow:var(--shadow);
  padding:18px !important;
}
.card h2{font-size:18px;margin-bottom:10px}

/* — 4. 模块按钮：大色块糖果卡 + 悬浮弹跳 — */
.modbtn{
  border:none !important;
  border-radius:22px !important;
  padding:18px 12px !important;
  font-size:16px !important;
  font-weight:900 !important;
  color:#fff !important;
  box-shadow:var(--shadow);
  transition:transform .15s ease, box-shadow .15s ease;
  background:var(--blue);
}
.modbtn:nth-child(8n+1){background:#FF8A3D}
.modbtn:nth-child(8n+2){background:#27A567}
.modbtn:nth-child(8n+3){background:#3E9BF0}
.modbtn:nth-child(8n+4){background:#9B6FE0}
.modbtn:nth-child(8n+5){background:#F5B325}
.modbtn:nth-child(8n+6){background:#FF7BAC}
.modbtn:nth-child(8n+7){background:#2EC4B6}
.modbtn:nth-child(8n+8){background:#FF6B6B}
.modbtn small{color:rgba(255,255,255,.92) !important;font-size:12px !important;margin-top:4px !important}
.modbtn:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.modbtn:active{transform:translateY(2px) scale(.97);box-shadow:0 2px 0 rgba(55,65,92,.10)}

/* — 5. 按钮：胶囊大按钮，底部厚边按压感 — */
.btn{
  border-radius:999px !important;
  padding:13px 26px !important;
  font-size:16.5px !important;
  font-weight:900 !important;
  box-shadow:0 5px 0 rgba(55,65,92,.16);
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(55,65,92,.16)}
.btn.orange{background:var(--orange)}
.btn.blue{background:var(--blue)}
.btn.plain{
  background:#fff !important;color:var(--ink) !important;
  border:2px solid var(--line) !important;box-shadow:0 4px 0 rgba(55,65,92,.08);
}

/* — 6. 单元列表：白卡 + 糖果编号 — */
.unitbtn{
  border:none !important;
  border-radius:22px !important;
  padding:15px 16px !important;
  box-shadow:var(--shadow);
  transition:transform .15s ease;
}
.unitbtn:hover{transform:translateY(-2px)}
.unitbtn .no{
  width:44px !important;height:44px !important;
  border-radius:16px !important;
  font-size:19px !important;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14);
}
.unitbtn .tt b{font-size:16.5px}

/* — 7. 知识点卡 — */
.kp{border-radius:20px !important;border-width:2px !important;padding:14px 16px !important}
.kp .head{font-size:16px !important}
.kp .head .dot{width:26px;height:26px;font-size:14px;border-radius:10px !important}

/* — 8. 题目区：大题干 + 大选项 — */
.qstem{
  font-size:20px !important;
  border-radius:22px !important;
  border-width:2.5px !important;
  padding:20px !important;
  box-shadow:var(--shadow);
}
.opt{
  font-size:17px !important;
  border-radius:18px !important;
  padding:15px 18px !important;
  border-width:2.5px !important;
  transition:transform .12s ease, background .12s ease;
}
.opt:hover{transform:translateY(-2px)}
.opt:active{transform:scale(.98)}
.opt.right{background:var(--greenL) !important;border-color:var(--green) !important;animation:pop .35s ease}
.opt.wrong{background:var(--redL) !important;border-color:var(--red) !important;animation:shake .35s ease}
@keyframes pop{0%{transform:scale(.96)}55%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

<script>
/* ═══════════════════════════════════════════════════════
   六上数学乐园 · 青岛版（六三制）六年级上册
   原创实现：知识卡 → 过关点亮 → 出题 → 错题隔日重考
   数据全部存在本机 localStorage，断网可用
   ═══════════════════════════════════════════════════════ */

/* ───────── 多课本架构（v3.0）────────────────────────────
   - BOOKS 注册表：每册一个模块文件 books/book-qdXX.js，暴露全局 BOOK_DEF
   - 外壳只认 BOOK_DEF（当前课本的 UNITS/BOARDS/CHEAT/GENS/GENLVL/INTRO）
   - kp id 全局唯一：六上沿用旧 id（1-1…），其余书带书前缀（如 qd5b-2-1），
     存档 lit/st/wrong 按全局 id 记录，各书互不影响
   - 存档 S 分桶：S.books[bid] = {lit,st,wrong,days,recent}；旧单书存档自动迁移到 qd6a 桶 */
var BOOK_KEY='qd6_book';   /* 每用户当前课本 id（localStorage） */
/* BOOKS/regBook/bookById 定义在页面顶部的注册表 script 中（先于课本模块加载） */
var BOOK_DEF=null;   /* 当前课本模块（由 loadBookPref/ setCurrentBook 设置） */
function applyBookPointers(){
  if(!BOOK_DEF)return;
  UNITS=BOOK_DEF.UNITS;BOARDS=BOOK_DEF.BOARDS;CHEAT=BOOK_DEF.CHEAT;
  GENS=BOOK_DEF.GENS;GENLVL=BOOK_DEF.GENLVL;
  syncBookRefs();
}
function curBookDef(){return BOOK_DEF}
/* 旧存档兼容迁移：{lit,st,wrong,...} → books:{qd6a:{...}}，
   顶层保留一份 qd6a 镜像（旧字段继续可读，服务端统计兼容） */
function migrateStateBuckets(v){
  if(v&&typeof v==='object'){
    if(!v.books||typeof v.books!=='object'){v.books={}}
    if(!v.books.qd6a&&(v.lit||v.st||v.wrong||v.days)){
      v.books.qd6a={lit:v.lit||{},st:v.st||{},wrong:v.wrong||[],days:v.days||{},recent:v.recent||[]};
    }
    /* 顶层旧字段保留（服务端统计兼容读取），分桶为权威数据源 */
    if(v.books.qd6a){v.lit=v.books.qd6a.lit;v.st=v.books.qd6a.st;v.wrong=v.books.qd6a.wrong;v.days=v.books.qd6a.days;v.recent=v.books.qd6a.recent||[]}
    return v;
  }
  return v;
}
/* 当前课本存档桶引用（S.books[bid]），读写经由 S 但聚焦到桶 */
function bookBucket(){
  var bid=BOOK_DEF?BOOK_DEF.id:'qd6a';
  if(!S.books)S.books={};
  if(!S.books[bid])S.books[bid]={lit:{},st:{},wrong:[],days:{},recent:[],t0:S.t0||Date.now()};
  var b=S.books[bid];
  if(!Array.isArray(b.wrong))b.wrong=[];
  if(!b.lit)b.lit={};if(!b.st)b.st={};if(!b.days)b.days={};if(!Array.isArray(b.recent))b.recent=[];
  return b;
}
/* 兼容层：让原有代码继续读写 S.lit/S.st/S.wrong/S.days/S.recent，
   实际指向当前课本的桶（getter/setter 代理） */
function syncBookRefs(){
  var b=bookBucket();
  S.lit=b.lit;S.st=b.st;S.wrong=b.wrong;S.days=b.days;S.recent=b.recent;
  if(CUR&&CUR.cloud)S.name=CUR.name;
}
/* 课本选择：保存当前课本 id */
function setCurrentBook(id){

  if(!def)return;
  BOOK_DEF=def;
  lsSet(BOOK_KEY,id);
  if(CUR){try{lsSet(BOOK_KEY+'_'+CUR.phone,id)}catch(e){}}
  applyBookPointers();
  QS=null;
}
function loadBookPref(){
  var id=null;
  if(CUR){try{id=lsGet(BOOK_KEY+'_'+CUR.phone)||lsGet(BOOK_KEY)}catch(e){}}
  if(!id)id=lsGet(BOOK_KEY);

/* ───────── 工具函数 ───────── */
function R(n){return Math.floor(Math.random()*n)}
function pick(a){return a[R(a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=R(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){var t=a%b;a=b;b=t}return a||1}
function frac(n,d){var g=gcd(n,d);n=n/g;d=d/g;return d===1?String(n):(n+'/'+d)}
/* 纯文本分数（存档/比对用），HTML 分数（界面显示用，横线式） */
function fracHTML(n,d){
  var g=gcd(n,d);n=n/g;d=d/g;
  if(d===1)return String(n);
  if(n<0)return '<span class="frac"><span class="nu">−'+(-n)+'</span><span class="de">'+d+'</span></span>';
  return '<span class="frac"><span class="nu">'+n+'</span><span class="de">'+d+'</span></span>';
}
/* 把字符串里的 a/b（最简或非最简）渲染成横线分数；支持 a/b × c/d 等混排 */
function rich(s){
  return String(s).replace(/(\d+)\/(\d+)/g,function(m,a,b){
    return fracHTML(+a,+b);
  });
}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function val(s){
  s=String(s).trim().replace(/%$/,'').replace(/^\+/,'');
  if(!s)return null;
  var m=s.match(/^(-?\d+)\/(\d+)$/);
  if(m){var d=+m[2];if(!d)return null;return +m[1]/d}
  var f=parseFloat(s);return isNaN(f)?null:f;
}
function checkAns(q,user){
  var u=String(user||'').trim();
  if(q.ratio){
    var m=u.match(/^(\d+)\s*[:：]\s*(\d+)$/);if(!m)return false;
    var g=gcd(+m[1],+m[2]);
    var c=q.ans.match(/^(\d+)[:：](\d+)$/);var g2=gcd(+c[1],+c[2]);
    return +m[1]/g===+c[1]/g2 && +m[2]/g===+c[2]/g2;
  }
  var uv=val(u),cv=val(q.ans);
  if(uv===null||cv===null)return false;
  return Math.abs(uv-cv)<1e-9;
}

/* ───────── 用户系统（注册/登录/管理员）─────────

   安全：密码不明文存储——SHA-256(随机盐 + 密码) 哈希（纯 JS 实现，兼容 http 环境） */

var LS_OK=true,LS_MEM={};
function lsProbe(){try{localStorage.setItem('__ls_probe','1');localStorage.removeItem('__ls_probe');return true}catch(e){return false}}

function lsWarn(){return '⚠ 当前浏览器环境不支持本地存储（常见于 IDE 预览面板、隐私模式），数据<b>仅保存在本次会话中</b>——刷新即丢失。请用系统浏览器（Chrome/Edge）打开本页或访问 NAS 网址，才能永久保存。'}
var UKEY='qd6_users';        /* 用户表 */
var CKEY='qd6_session';      /* 当前登录会话 */
var BKEY1='qd6_users_bak1';  /* 备份快照 1（每次写入前滚动） */
var BKEY2='qd6_users_bak2';  /* 备份快照 2（隔次滚动，防单点损坏） */
/* 预置管理员凭证（salt 与 hash 必须配对：hash = sha256(salt + '::' + 密码)）
   仓库内为示例值，对应密码 Change@Me2026 —— 自行部署时请改成你自己的凭证：
   node -e "console.log(require('crypto').createHash('sha256').update('你的salt::你的密码').digest('hex'))" */
var ADMIN_PHONE='13455656547', ADMIN_SALT='e9d4c1a7b3f08256', ADMIN_HASH='780afbeb46dfdba13c7e28be373e6003de70cef817bcc947ac6da26f4bed436a';

/* 纯 JS SHA-256（FIPS 180-4，内置实现，兼容 http/https/file） */
function sha256(ascii){
  function rightRotate(v,a){return (v>>>a)|(v<<(32-a))}
  var mathPow=Math.pow,maxWord=mathPow(2,32),result='',words=[],asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],primeCounter=k.length;
  var isComposite={};

    if(!isComposite[candidate]){
      for(var i=0;i<313;i+=candidate)isComposite[i]=candidate;
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;

  while(ascii.length%64-56)ascii+='\x00';

  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16),oldHash=hash;
    hash=hash.slice(0,8);

      var w15=w[i-15],w2=w[i-2];

      hash[0]=temp1+temp2|0;
    }

function str2utf8(s){return decodeURIComponent(encodeURIComponent(s))}
function hashPass(salt,pass){return sha256(str2utf8(salt+'::'+pass))}

/* 用户表读写（带双备份与写入保护） */
function loadUsers(){

function validPhone(p){return /^1\d{10}$/.test(p)}
/* 密码规则：必须 10 位，同时含数字/大写/小写/特殊符号 */
function passIssue(p){
  if(typeof p!=='string'||p.length<10||p.length>32)return '密码长度必须 10-32 位（当前 '+(p?p.length:0)+' 位）';
  if(!/[0-9]/.test(p))return '密码必须包含数字';
  if(!/[A-Z]/.test(p))return '密码必须包含大写字母';
  if(!/[a-z]/.test(p))return '密码必须包含小写字母';
  if(!/[^0-9A-Za-z]/.test(p))return '密码必须包含特殊符号（如 !@#$%^&*）';
  return null;
}

/* ───────── v3.3 记住密码（仅本机）─────────
   存储：qd6_remember = {phones:{手机号:混淆密码}, last:最近登录手机号}
   混淆：XOR 固定钥 + base64（防 casual 肩窥/明文落盘，非加密；设备本身即安全边界，
   与 30 天会话 token 同等信任级别）。最多记 6 个账号（两娃共用设备场景）。 */
var RMB_KEY='qd6_remember';
function rmbXor(s){var k='qd6r2026',o='';for(var i=0;i<s.length;i++)o+=String.fromCharCode(s.charCodeAt(i)^k.charCodeAt(i%k.length));return o}
function obf(s){return btoa(unescape(encodeURIComponent(rmbXor(s))))}
function deobf(s){try{return rmbXor(decodeURIComponent(escape(atob(s))))}catch(e){return ''}}
function loadRemember(){try{var v=JSON.parse(lsGet(RMB_KEY));if(v&&v.phones&&typeof v.phones==='object')return v}catch(e){}return {phones:{},last:null}}
function saveRemember(r){try{lsSet(RMB_KEY,JSON.stringify(r))}catch(e){}}
function rememberSet(ph,pass){
  var r=loadRemember();
  r.phones[ph]=obf(pass);r.last=ph;
  var ks=Object.keys(r.phones);
  while(ks.length>6){                      /* 超限淘汰最旧的非最近账号 */
    var drop=ks.find(function(x){return x!==r.last});
    if(!drop)break;
    delete r.phones[drop];ks=Object.keys(r.phones);
  }
  saveRemember(r);
}
function rememberGet(ph){var r=loadRemember();return r.phones[ph]?deobf(r.phones[ph]):''}
function rememberClear(ph){
  var r=loadRemember();
  if(ph){delete r.phones[ph];if(r.last===ph)r.last=Object.keys(r.phones)[0]||null}
  else{r.phones={};r.last=null}
  saveRemember(r);
}
function handleRemember(ph,p){
  var chk=document.getElementById('rmbChk');
  if(chk&&chk.checked)rememberSet(ph,p);
  else rememberClear(ph);
}
function fillRemember(ph){

/* v2.4：同步架构。load() 仍同步读本地缓存（云端模式下是「最近一次云端副本」，页面秒开）；
   cloudLoadState 在登录/启动时异步拉云端覆盖；save() 本地落盘后异步推云端（乐观锁+冲突合并）。
   未登录游客与 NAS 不可达时行为与 v2.3 完全一致。 */
function load(){  /* 依据登录态加载对应存档 */
  var def={name:'',lit:{},st:{},wrong:[],days:{},t0:Date.now(),recent:[],books:{}};
  function compat(v){  /* v2.4.6 向后兼容 + v3.0 分桶迁移：旧存档缺 recent/books 时补空，原字段一律不动 */
    if(v&&typeof v==='object'){
      if(!Array.isArray(v.recent))v.recent=[];
      migrateStateBuckets(v);
      return v;
    }
    return def;
  }
  if(CUR){try{var v=JSON.parse(lsGet(userKey(CUR.phone)));return compat(v)}catch(e){}return compat(def)}
  try{var g=JSON.parse(lsGet(KEY));return compat(g)}catch(e){}
  return compat(def);
}
/* v2.4.6 题面指纹去重：S.recent 滚动记录最近 300 条题面（含数字，天然区分参数组合）。
   组题时优先抽没做过的；池太小（如应用题特训）不足时按序补齐，保证永远有题可出。 */
var RECENT_MAX=300;
function rememberQ(qq){
  if(!Array.isArray(S.recent))S.recent=[];
  var i=S.recent.indexOf(qq);
  if(i>=0)S.recent.splice(i,1);      /* 已存在则移到尾部（刷新"最近做过"） */
  S.recent.push(qq);
  while(S.recent.length>RECENT_MAX)S.recent.shift();
}
function dedupPick(genFn,n){
  /* genFn():返回候选规格数组；返回 n 个 makeQ 前的规格，优先未做过的题面。
     策略：先严格排除 recent+组内重复；若池形态太少抽不满，退一步「放宽 recent、仅组内去重」；
     再不够则允许组内重复补满（保证永远有题可出，如应用题特训小池）。 */
  var out=[],used={},tries=0,maxTries=n*30;
  var cache={};
  function peek(spec){
    var key=spec.g+'|'+spec.u+'|'+spec.k;
    if(!(key in cache))cache[key]=makeQ(spec).q;
    return cache[key];
  }
  while(out.length<n&&tries<maxTries){
    tries++;
    var pool=genFn();
    if(!pool||!pool.length)break;
    var spec=pick(pool);
    var q=peek(spec);
    if(S.recent.indexOf(q)>=0)continue;          /* 近期做过 → 跳过 */
    if(used[q])continue;                          /* 本组内去重 */
    used[q]=1;out.push(spec);
  }
  /* 池形态不足：放宽 recent（允许做过），仅组内去重补满 */
  if(out.length<n){
    var guard=0;
    while(out.length<n&&guard<n*30){
      guard++;
      var pool2=genFn();
      if(!pool2||!pool2.length)break;
      var spec2=pick(pool2);
      var q2=peek(spec2);
      if(used[q2])continue;
      used[q2]=1;out.push(spec2);
    }
  }
  /* 极端小池（形态数 < n）：允许组内重复，直接补满 */
  if(out.length<n){
    var g3=0,base=out.slice();
    while(out.length<n&&g3<n*10){
      g3++;
      out.push(base[g3%base.length]);
    }
  }
  return out;
}

  }

function doLogin(){
  var ph=(document.getElementById('logPhone').value||'').trim();
  var p=document.getElementById('logPass').value||'';
  var msg=document.getElementById('logMsg');
  function fail(t){msg.textContent='✕ '+t}
  if(!ph)return fail('请输入手机号');
  if(!validPhone(ph))return fail('手机号格式不正确：必须 11 位且以 1 开头');
  /* v2.4 云端模式：验证与锁定策略由服务端执行 */
  if(CLOUD.on){
    msg.style.color='';msg.textContent='… 正在登录…';
    cloudLogin(ph,p).then(function(r){
      if(r.ok)return r;
      /* v2.4.2 存量本地账号自动升级上云：云端无此号，但本机账号表里有且密码验证通过
         → 用 /api/admin/import 通道（服务端会校验操作者是 admin）走不通；
         改用一次性「本地凭证迁移」：本机验证 salt/hash 通过后，调 register 重建云端账号，
         成功后把本地存档推上去。若本机也没有此号 → 返回原始错误。 */
      var lu=findUser(ph);
      if(lu&&lu.salt&&lu.hash&&hashPass(lu.salt,p)===lu.hash&&!lu.banned){
        msg.textContent='… 检测到本机存量账号，正在升级为云端账号…';
        return cloudRegister(ph,lu.name,p).then(function(rr){
          if(!rr.ok)throw new Error(rr.err||'升级失败');
          /* 本地存档随首登自动迁移（cloudMaybeMigrate 在后续流程触发）；这里同步清掉本地账号表该条目，避免双份歧义 */
          try{
            var db=USERS;
            db.users=db.users.filter(function(x){return x.phone!==ph});
            saveUsers(db);
          }catch(e){}
          return {ok:true,user:rr.user,upgraded:true};
        });
      }
      return r;
    }).then(function(r){
      if(!r.ok)return fail(r.err);
      handleRemember(ph,p);   /* v3.3：按勾选状态记住/清除密码 */
      msg.style.color='#1E8449';msg.textContent=r.upgraded?'✓ 已升级为云端账号（进度同步到 NAS）！':'✓ 登录成功（云端账号）！';
      CUR={phone:ph,role:r.user.role,name:r.user.name,cloud:true};try{lsSet(CKEY,JSON.stringify(CUR))}catch(e){}
      /* 拉云端最新存档 → 缓存到本地 → 首页；同时检查本机旧档是否需迁移上云 */
      cloudLoadState(ph).then(function(st){
        if(st.data){try{lsSet(userKey(ph),JSON.stringify(st.data))}catch(e){}}
        cloudMaybeMigrate(ph).then(function(){S=load();syncBookRefs();save();setTimeout(function(){go('home')},400)});
      }).catch(function(){S=load();syncBookRefs();save();setTimeout(function(){go('home')},400)});
    }).catch(function(e){fail(e&&e.message?e.message:'云端服务不可达，请稍后再试')});
    return;
  }
  var u=findUser(ph);
  if(!u)return fail('该手机号尚未注册，请先注册');
  if(u.banned)return fail('⛔ 该账号已被封禁'+(u.banReason?'：'+u.banReason:'')+'。如有疑问请联系管理员。');
  if(u.lockUntil&&Date.now()<u.lockUntil)return fail('密码错误次数过多，账号已锁定，请 '+Math.ceil((u.lockUntil-Date.now())/60000)+' 分钟后再试');
  if(hashPass(u.salt,p)!==u.hash){
    u.failN=(u.failN||0)+1;
    if(u.failN>=5){u.lockUntil=Date.now()+10*60*1000;u.failN=0}
    saveUsers(USERS);
    return fail('密码不正确'+(u.lockUntil?'，已连续错 5 次，锁定 10 分钟':''));
  }
  u.failN=0;delete u.lockUntil;u.lastLogin=nowStr();saveUsers(USERS);
  setSession({phone:ph,role:u.role,name:u.name});
  handleRemember(ph,p);   /* v3.3：按勾选状态记住/清除密码 */
  S=load();syncBookRefs();save();  /* 登录即落盘，生成该用户独立存档 */
  msg.style.color='#1E8449';msg.textContent='✓ 登录成功！';
  setTimeout(function(){go('home')},400);
}

/* v3.0 多课本：六上教材结构已迁至 books/book-qd6a.js；UNITS/BOARDS/GENS/GENLVL/CHEAT 为当前课本指针 */
var UNITS=[];

var BOARDS=[];

/* v3.0 多课本：六上出题生成器已迁至 books/book-qd6a.js */
var GENS={};

var GENLVL={};

function genPool(unitId,level){
  var out=[];
  UNITS.forEach(function(un){
    if(unitId&&!isRevId(unitId)&&String(un.id)!==String(unitId))return;
    if(unitId&&isRevId(unitId)&&isRevId(un.id))return;   /* 总复习=全部内容单元混合 */
    un.kps.forEach(function(kp){
      kp.gens.forEach(function(g){
        if(!GENS[g])return;
        if(level&&GENLVL[g]!==level)return;
        out.push({g:g,u:un.id,k:kp.id});
      });
    });
  });
  return out;
}
function makeQ(spec){
  var q=GENS[spec.g](spec.u,spec.k);
  q.lvl=GENLVL[spec.g]||2;
  return q;
}
/* 难度混合策略：易30% 中50% 挑战20% */
function mixPool(unitId,n){
  var out=[],tries=0;
  while(out.length<n&&tries<n*30){
    tries++;
    var r=Math.random(),lv=r<0.3?1:(r<0.8?2:3);
    var pool=genPool(unitId,lv);
    if(!pool.length)pool=genPool(unitId,0);
    var spec=pick(pool);
    if(out.length&&out[out.length-1].g===spec.g&&tries<n*15)continue;
    out.push(spec);
  }
  return out;
}

   CLOUD.on：/api/ping 探测成功后置 true。云端模式下：
   - 账号表与学习存档全部存 NAS（server/server.js）

   - 管理员账号管理（新增/编辑/重置密码/封禁/删除）全部服务端鉴权
   NAS 不可达自动回退 localStorage 本地模式（功能不变）。 */

function cloudBase(){

function cloudFetch(path,opt){

/* 启动探测：成功→云端模式并恢复会话；失败→本地模式 */
function cloudProbe(){

    if(r.code===200&&r.body&&r.body.cloud){
      CLOUD.on=true;CLOUD.ready=true;

            CUR={phone:w.body.user.phone,role:w.body.user.role,name:w.body.user.name,cloud:true};
            try{lsSet(CKEY,JSON.stringify(CUR))}catch(e){}
          }else{CLOUD.token=null;cloudSaveTok()}

}

/* 云端存档：load0 拉取（返回 {data,rev}），save0 提交（冲突自动合并重试一次） */
function cloudLoadState(phone){
  return cloudFetch('/state',{method:'GET'}).then(function(r){
    if(r.code===200&&r.body.ok){CLOUD.rev[phone]=r.body.rev;return {data:r.body.data,rev:r.body.rev}}
    throw new Error('state read '+r.code);
  });
}
function cloudSaveState(phone,data){
  var rev=CLOUD.rev[phone]||0;
  return cloudFetch('/state',{method:'PUT',body:JSON.stringify({rev:rev,data:data})}).then(function(r){
    if(r.code===200&&r.body.ok){CLOUD.rev[phone]=r.body.rev;return {ok:true}}
    if(r.code===409&&r.body.err==='conflict'){
      /* 冲突：另一台设备写过。拉最新 → 浅合并（days/st 累加保留最大，wrong 数组去重拼接）→ 重试一次 */
      var remote=r.body.data||{};
      var merged=mergeState(remote,data);
      return cloudFetch('/state',{method:'PUT',body:JSON.stringify({rev:r.body.rev,data:merged})}).then(function(r2){
        if(r2.code===200&&r2.body.ok){CLOUD.rev[phone]=r2.body.rev;return {ok:true,merged:true}}
        return {ok:false,err:'同步冲突，请刷新页面重试'};
      });
    }
    if(r.code===401){CLOUD.token=null;cloudSaveTok();CUR=null;return {ok:false,err:'登录已过期，请重新登录',relogin:true}}
    return {ok:false,err:r.body.err||('保存失败('+r.code+')')};
  });
}
/* 两设备进度合并（v3.0 分桶版）：对每个课本桶做字段级合并（取最大/并集），wrong 按内容去重；
   qd6a 桶镜像到顶层旧字段，兼容服务端统计与旧版字段读取。 */
function mergeState(a,b){
  a=a||{};b=b||{};
  function mergeBucket(x,y){
    x=x||{};y=y||{};
    var o={lit:{},st:{},wrong:[],days:{},recent:[]};
    var recA=Array.isArray(x.recent)?x.recent:[],recB=Array.isArray(y.recent)?y.recent:[];
    var seenR={},mR=[];
    recA.concat(recB).forEach(function(q){if(q&&typeof q==='string'&&!seenR[q]){seenR[q]=1;mR.push(q)}});
    o.recent=mR.slice(-300);
    Object.keys(y.lit||{}).forEach(function(k){if(y.lit[k])o.lit[k]=true});
    Object.keys(x.lit||{}).forEach(function(k){if(x.lit[k])o.lit[k]=true});
    Object.keys(y.st||{}).forEach(function(k){o.st[k]={att:(y.st[k].att||0),cor:(y.st[k].cor||0)}});
    Object.keys(x.st||{}).forEach(function(k){
      if(!o.st[k])o.st[k]={att:0,cor:0};
      o.st[k].att=Math.max(o.st[k].att||0,x.st[k].att||0);
      o.st[k].cor=Math.max(o.st[k].cor||0,x.st[k].cor||0);
    });
    var seen={},wa=x.wrong||[],wb=y.wrong||[];
    wb.concat(wa).forEach(function(w){var k=(w&&w.id!==undefined?w.id+'_'+(w.seed||''):JSON.stringify(w));if(!seen[k]){seen[k]=1;o.wrong.push(w)}});
    o.wrong=o.wrong.slice(-200);
    var dA=x.days||{},dB=y.days||{};
    Object.keys(dB).forEach(function(k){o.days[k]={att:(dB[k].att||0),cor:(dB[k].cor||0)}});
    Object.keys(dA).forEach(function(k){
      if(!o.days[k])o.days[k]={att:0,cor:0};
      o.days[k].att=Math.max(o.days[k].att||0,dA[k].att||0);
      o.days[k].cor=Math.max(o.days[k].cor||0,dA[k].cor||0);
    });
    return o;
  }
  var out={name:b.name||a.name||'',t0:a.t0||b.t0||Date.now(),lit:{},st:{},wrong:[],days:{},recent:[],books:{}};
  var ids={};
  Object.keys(a.books||{}).forEach(function(k){ids[k]=1});
  Object.keys(b.books||{}).forEach(function(k){ids[k]=1});
  Object.keys(ids).forEach(function(k){
    var mb=mergeBucket((a.books||{})[k],(b.books||{})[k]);
    out.books[k]=mb;
    if(k==='qd6a'){out.lit=mb.lit;out.st=mb.st;out.wrong=mb.wrong;out.days=mb.days;out.recent=mb.recent}
  });
  /* 任一端是旧版单书数据（无分桶）→ 折入 qd6a 桶 */
  if(!out.books.qd6a&&(a.lit||a.st||a.wrong||b.lit||b.st||b.wrong)){
    var legacy=mergeBucket({lit:a.lit,st:a.st,wrong:a.wrong,days:a.days,recent:a.recent},
                           {lit:b.lit,st:b.st,wrong:b.wrong,days:b.days,recent:b.recent});
    out.books.qd6a=legacy;
    out.lit=legacy.lit;out.st=legacy.st;out.wrong=legacy.wrong;out.days=legacy.days;out.recent=legacy.recent;
  }
  return out;
}
/* 首次迁移：云端账号存档为空且本地有旧存档时，自动上传（一次性） */
function cloudMaybeMigrate(phone){
  if(CLOUD.migrating)return Promise.resolve();
  CLOUD.migrating=true;
  return cloudLoadState(phone).then(function(st){
    if(st.data)return null;                       /* 云端已有数据，不覆盖 */
    var local=null;try{local=JSON.parse(lsGet(userKey(phone)))}catch(e){}
    if(!local||typeof local!=='object')return null;
    return cloudSaveState(phone,local).then(function(){console.info('本地存档已自动迁移上云',phone);return true});
  }).catch(function(e){console.warn('迁移检查失败(忽略)',e&&e.message)}).then(function(){CLOUD.migrating=false});
}

  if(!u)return false;

}

function go(name,arg){
  if(window._autoTimer){clearInterval(window._autoTimer);window._autoTimer=null}
  /* 管理员视图保护：普通用户不可达 */
  if((name==='admin'||name==='userAdmin')&&!isAdmin()){CUR=CUR;window.scrollTo(0,0);VIEWS.noPerm();return}
  /* v2.4.4 云端模式：封禁/权限以服务端为准，操作后重新拉取（「及时生效」） */
  if(CUR&&CUR.cloud){
    return cloudFetch('/whoami',{method:'GET'}).then(function(w){
      if(w.code===200&&w.body.ok){
        CLOUD_ME={phone:w.body.user.phone,role:w.body.user.role,name:w.body.user.name,perms:w.body.user.perms||null,banned:!!w.body.user.banned,banReason:w.body.user.banReason||null};
        CUR={phone:w.body.user.phone,role:w.body.user.role,name:w.body.user.name,cloud:true};
        try{lsSet(CKEY,JSON.stringify(CUR))}catch(e){}
        if(CLOUD_ME.banned){window.scrollTo(0,0);VIEWS.bannedView(CLOUD_ME);return}
        window.scrollTo(0,0);VIEWS[name](arg);
      }else{
        CUR=null;CLOUD.token=null;cloudSaveTok();S=load();syncBookRefs();
        window.scrollTo(0,0);VIEWS.home();
      }
    }).catch(function(){
      /* 网络抖动：沿用缓存事实放行，不做离线误踢 */
      window.scrollTo(0,0);VIEWS[name](arg);
    });
  }
  /* 封禁检查：实时读用户表，封禁后即使在线也会被踢出 */
  var cu=CUR?findUser(CUR.phone):null;
  if(cu&&cu.banned){
    var bu=cu;CUR=null;lsRm(CKEY);S=load();syncBookRefs();
    window.scrollTo(0,0);VIEWS.bannedView(bu);return;
  }
  /* 模块权限检查（管理员豁免） */
  var pm=PERM_ROUTE[name];
  if(pm&&!hasPerm(pm)){window.scrollTo(0,0);VIEWS.noPerm();return}
  window.scrollTo(0,0);VIEWS[name](arg);
}

function startPass(kid){

  for(var i=0;i<10;i++){var s=pick(specs);qs.push(makeQ(s))}
  QS={qs:qs,i:0,mode:'pass',kid:kid,okN:0,okStreak:0,title:'过关检验 · '+kp.name,log:[]};
  go('quiz');
}
function startDrill(kid){

  var kp=null,uid=0;
  UNITS.forEach(function(u){u.kps.forEach(function(k){if(k.id===kid){kp=k;uid=u.id}})});
  var specs=kp.gens.map(function(g){return{g:g,u:uid,k:kid}});
  var qs=[];for(var i=0;i<10;i++){qs.push(makeQ(pick(specs)))}

function startUnitApp(uid){
  if(!permGate('units'))return;
  /* 收集该单元所有应用题生成器（总复习=全册应用题混出） */
  var pool=[];
  UNITS.forEach(function(un){
    if(isRevId(String(uid))){ if(!isRevId(un.id)){un.kps.forEach(function(kp){kp.gens.forEach(function(g){if(GENS[g]&&GENLVL[g])pool.push({g:g,u:un.id,k:kp.id})})})} }
    else if(String(un.id)===String(uid)){ un.kps.forEach(function(kp){kp.gens.forEach(function(g){if(!GENS[g])return;pool.push({g:g,u:un.id,k:kp.id})})}) }
  });
  /* 先跑一遍筛出真正带 app 标记的模板 */
  var appPool=pool.filter(function(x){var t=GENS[x.g](x.u,x.k);return t&&t.app});
  if(!appPool.length){appPool=pool}
  var qs=dedupPick(function(){return appPool},20).map(makeQ);
  var name=UNITS.find(function(u){return u.id===uid}).name;
  startQuiz(qs,'gen',name+' 应用题特训',function(){
    return dedupPick(function(){return appPool},20).map(makeQ);
  });
}

      <div style="margin-top:8px"><input type="file" id="photoIn" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(this)">
        <button class="btn plain" style="width:100%" onclick="document.getElementById('photoIn').click()">📷 拍照上传手写解题过程</button>
        <div id="photoPrev" style="margin-top:8px"></div></div>
      <div style="margin-top:10px"><button class="btn" style="width:100%" onclick="answer(-1,document.getElementById('freeIn').value)">提交答案</button></div>`;

      <div style="margin-top:10px"><button class="btn" style="width:100%" onclick="answer(-1,document.getElementById('freeIn').value)">提交答案</button></div>`;
  }

  <div id="nextWrap" style="margin-top:12px;display:none"><button class="btn blue" style="width:100%" id="nextBtn">下一题 →</button></div>`;

    var fi=document.getElementById('freeIn');

function answer(optIdx,free){
  if(window._answered)return;
  var q=QS.qs[QS.i],user;
  if(q.ops){user=q.ops[optIdx]}
  else{user=String(free||'').trim()}
  window._answered=true;
  if(q.app&&!q.ops){
    /* 应用题过程作答：拍照优先（AI 视觉识别）→ 文本两级判分（本地数字提取 → AI） */
    var fb0=document.getElementById('fb');
    fb0.className='fb';
    if(window._photoData){
      fb0.innerHTML='⏳ AI 正在识别照片中的解题过程…';
      gradePhoto(q,user,window._photoData,function(res){
        window._photoData=null;
        finishAnswer(q,!!res.correct,user,(res.recognized?'📝 <b>识别的过程：</b>'+res.recognized+'<br>':'')+(res.feedback?'🤖 <b>AI 点评：</b>'+res.feedback:null),optIdx);
      });
      return;
    }
    fb0.innerHTML='⏳ 正在判分…';
    gradeAnswer(q,user,function(res){finishAnswer(q,!!res.correct,user,res.feedback||null,optIdx)});
    return;
  }
  var correct=q.ops?(user===q.ans):checkAns(q,user);
  finishAnswer(q,!!correct,user,null,optIdx);
}
/* 拍照上传：压缩图片并预览（手机拍的照片可达数 MB，base64 前必须压缩） */
function handlePhoto(inp){
  var f=inp.files&&inp.files[0];
  if(!f)return;
  try{
    var rd=new FileReader();
    rd.onload=function(){
      var img=new Image();

/* 从多行过程作答中提取最终数值（支持分数/小数/百分数；优先"答："行）
   v3.3.2：增加中文分数解析——「一百分之39 / 百分之39」→ 39/100。
   此前会误提取成 39（分子），数值判分必错：学生明明答对却被判 mismatch。 */
function extractFinal(text){
  var s=String(text||'');
  /* 中文分数：X百分之Y / 百分之Y（Y 可含小数）→ 优先级最高，
     否则「一百分之39」会被答字/裸数字分支误提取成 39（v3.3.2 修复）；
     变体「100分之31」= 31/100（数字分之数字，分母在前） */
  var cnAll0=s.match(/([一二三四五六七八九十\d]+)\s*百分之\s*(\d+(?:\.\d+)?)/);
  var cnAll02=s.match(/百分之\s*(\d+(?:\.\d+)?)/);
  if(cnAll0)return cnAll0[2]+'/100';
  if(cnAll02)return cnAll02[1]+'/100';
  var fz=s.match(/(\d+)\s*分之\s*(\d+(?:\.\d+)?)/);
  if(fz)return fz[2]+'/'+fz[1];
  var m=s.match(/答\s*[：:][^\n\d\-]*(-?\d+(?:\.\d+)?(?:\/\d+)?)\s*(?:%|（[^）]*）)?/);
  if(m)return m[1];
  var nums=s.match(/-?\d+(?:\.\d+)?(?:\/\d+)?%?/g);
  if(!nums)return null;
  var last=nums[nums.length-1];
  return /%$/.test(last)?last.replace(/%$/,''):last;
}
/* 本地预判：ok=最终答案数值正确 / mismatch=数值不一致 / none=提不出数值
   v3.4.3 修复：比值题（ans 形如 a:b）禁用 extractFinal——它会把 "10:8" 拆成 "8"，
   与 val("10:8")=10 比较造成假 mismatch；改走 checkAns 的化简比判等（10:8=5:4=20:16）。 */
function procLocalGrade(q,text){
  var s=String(text||'').trim();
  if(q.ratio||/^\d+\s*[:：]\s*\d+$/.test(String(q.ans||'').trim())){
    var all=s.match(/\d+\s*[:：]\s*\d+/g);
    if(!all)return {level:'none'};
    var cq=q.ratio?q:{ratio:1,ans:q.ans};
    return {level:checkAns(cq,all[all.length-1])?'ok':'mismatch'};
  }
  var v=extractFinal(s);
  if(v===null)return {level:'none'};
  var uv=val(v),cv=val(q.ans);
  if(uv===null||cv===null)return {level:'none'};
  return {level:Math.abs(uv-cv)<1e-9?'ok':'mismatch'};
}

function renderFTHealth(){
  var cb=document.getElementById('ftOn');if(!cb)return;   /* 面板未渲染时静默返回 */
  var ft=getFT();
  cb.checked=!!ft.on;

  var cd=document.getElementById('ftCooldown');if(cd)cd.value=Math.round(ft.cooldown/1000);
  var box=document.getElementById('ftHealth');

      var m=chains[i],h=AI_HEALTH[m]||{fails:0,openUntil:0};
      var left=Math.max(0,h.openUntil-Date.now());
      var st=left>0?('熔断中 '+Math.ceil(left/1000)+'s'):(h.fails?('失败 '+h.fails+' 次'):'正常');
      parts.push(m+'：'+st);
    }

  }
}
function saveFTcfg(){
  var m=document.getElementById('ftMsg'),ft=getFT();
  var on=document.getElementById('ftOn').checked?1:0;
  var raw=(document.getElementById('ftChain').value||'').trim();
  var chain=raw.split(/[,，]/).map(function(s){return s.trim()}).filter(Boolean);
  if(!chain.length){m.style.color='#C0392B';m.textContent='✕ 候选模型链不能为空';return}
  if(chain.length>30){m.style.color='#C0392B';m.textContent='✕ 最多配置 30 个模型';return}
  chain=chain.slice(0,30);
  var to=+document.getElementById('ftTimeout').value;
  var rt=+document.getElementById('ftRetries').value;
  var tp=+document.getElementById('ftTrip').value;
  var cd=+document.getElementById('ftCooldown').value;
  if(!(to>=1000)){m.style.color='#C0392B';m.textContent='✕ 超时至少 1000ms';return}
  ft.on=on;ft.chain=chain;ft.timeoutText=to;ft.budgetText=Math.max(to*2,20000);
  ft.timeoutVision=Math.max(to,15000);ft.budgetVision=Math.max(to*3,45000);
  ft.retries=isFinite(rt)?Math.max(0,Math.min(3,rt)):1;
  ft.tripFails=isFinite(tp)?Math.max(1,Math.min(10,tp)):3;
  ft.cooldown=isFinite(cd)?Math.max(5,cd)*1000:60000;
  saveFT(ft);
  m.style.color='#1E8449';m.textContent='✓ 容灾设置已保存（'+chain.length+' 个候选模型，按此顺序切换）';
  renderFTHealth();

function callLLM(q,user,cfg,photo){
  var prompt='你是小学数学老师，请判定学生的应用题作答是否正确。\n'
    +'【题目】'+q.q+'\n'
    +'【标准答案】'+q.ans+'\n'
    +'【参考解析】'+(q.exp||'无')+'\n'
    +(photo
      ?'【学生作答】学生把解题过程写在纸上并拍照上传'+(user?'，并补充了文字：'+user:'（无文字补充）')+'。请先识别照片中的手写解题过程，再按识别内容判定。\n'
      :'【学生作答（可能包含分步计算过程）】\n'+user+'\n')
    +'判定规则：\n'
    +'0. 【标准答案】由程序精确计算并经过校验，绝对正确——你点评时只能围绕它解释思路，禁止重新计算、禁止给出不同数值；\n'
    +'1. 只要最终答案数值正确（分数等价、单位不影响判定）即为正确，过程写法不必与标准解析一致；\n'
    +'2. 最终答案错误但过程思路正确时，判不正确，并在点评中指出错在哪一步；\n'
    +'3. 学生只写最终答案也算有效作答；\n'
    +'4. 点评用小学生能看懂的中文，不超过 60 字。\n'
    +(photo
      ?'只输出一行 JSON：{"recognized": "照片中手写过程的文字转写", "correct": true 或 false, "feedback": "点评"}'
      :'只输出一行 JSON：{"correct": true 或 false, "feedback": "点评"}');
  var msgContent=photo
    ?[{type:'text',text:prompt},{type:'image_url',image_url:{url:photo}}]
    :prompt;
  return aiRequest({messages:[{role:'user',content:msgContent}],temperature:0,max_tokens:photo?500:300},
    {vision:!!photo,check:function(txt){
      var mm=String(txt).match(/\{[\s\S]*\}/);
      var oo=mm?JSON.parse(mm[0]):null;
      if(!oo||typeof oo.correct!=='boolean')throw new Error('AI 返回格式异常');
    }},cfg)
  .then(function(txt){
    var m=String(txt).match(/\{[\s\S]*\}/);
    var obj=JSON.parse(m[0]);
    return {correct:!!obj.correct,feedback:String(obj.feedback||'').slice(0,150),recognized:photo?String(obj.recognized||'').slice(0,300):null};
  });
}

function gradeAnswer(q,user,cb){
  var local=procLocalGrade(q,user);
  if(local.level==='ok')return cb({correct:true,feedback:null});
  if(!hasPerm('ai')){
    var msg0=local.level==='mismatch'?'按最终答案判定为不正确。':'未授权 AI 判分。请至少写明最终答案（如「答：48 平方米」）。';
    return cb({correct:false,feedback:msg0});
  }
  var cfg=getAIcfg();
  callLLM(q,user,cfg)
    .then(function(r){cb(r)})
    .catch(function(e){
      /* v3.4.3 修复：AI 故障（含 429 限流）不应等同于答错。先用本地判分兜底——
         比值题/数值题本地已能精确判定，AI 挂掉时按本地结果走，避免"答案正确却被判错"。 */
      var local2=procLocalGrade(q,user);
      if(local2.level==='ok')return cb({correct:true,feedback:null});
      var tip=/429/.test(e.message)?'判分服务繁忙，请稍后再试一次':e.message;
      cb({correct:false,feedback:'AI 判分调用失败（'+tip+'），按最终答案判定：不正确。'});
    });
}

/* —— v3.4 举一反三：参照错题用 AI 出同类题（参考小小刷题家 /api/questions/:id/similar 的策略）——
   数据来源：S.wrong[i]（题干/答案/解析/单元）；生成走同源 /ai/ 网关（callLLM，无 Key 代理）；
   生成的选择题/填空题直接塞进现有答题引擎，计分/统计/错题收录全复用。
   防循环：AI 生成的题再答错不收错题本（source:'similar'，finishAnswer 里识别跳过）。 */
var SIM_Q=null;   /* 暂存 AI 生成的题组 */
function similarFromWrong(i){
  var w=S.wrong[i];
  if(!w)return;
  var msg=document.getElementById('simMsg_'+i);
  if(!hasPerm('ai')){if(msg){msg.style.color='var(--red)';msg.textContent='✕ 当前账号未授权 AI 功能，请联系管理员开通。'}return}
  if(msg){msg.style.color='var(--sub)';msg.textContent='… AI 正在出题，约 10 秒…'}
  var prompt='你是小学数学老师。基于下面的错题出 5 道同类练习题（举一反三）：\n'
    +'- 换一个生活情境、换一组数字，考的知识点和难度与原题相当\n'
    +'- 原题是选择题就出选择题（4 个选项，干扰项埋在常见错点上）；原题是填空/应用题就出填空题（答案是一个数或最简分数，如 3/4）\n'
    +'- 若题干含分数，答案必须用最简分数或整数表示，禁止小数\n'
    +'只输出一行 JSON，不要解释。格式：{"questions":[{"stem":"题干","ops":["选项A","选项B","选项C"] 或 null,"ans":"正确答案","exp":"30字以内讲解"}]}\n\n'
    +'【原题】'+w.q+'\n【选项】'+(w.ops?JSON.stringify(w.ops):'无（填空/应用题）')+'\n【正确答案】'+w.ans+'\n【解析】'+(w.exp||'无');
  callLLMRaw(prompt,getAIcfg()).then(function(r){
    var txt=(r&&r.text)||'';
    var m=txt.match(/\{[\s\S]*\}/);
    var parsed=m?JSON.parse(m[0]):null;
    var qs=(parsed&&Array.isArray(parsed.questions)?parsed.questions:[]).slice(0,5).map(function(x){
      var ans=String(x.ans||'').trim();
      /* v3.4.3 修复：比值答案（a:b）不走过程作答通道——该通道 extractFinal 不识别比值。
         标 app:0 + ratio:1 后走 checkAns 化简比判等，彻底绕开误判（如 10:8）。 */
      var isRatio=/^\d+\s*[:：]\s*\d+$/.test(ans);
      return {q:String(x.stem||'').trim(),ops:Array.isArray(x.ops)&&x.ops.length>=2?x.ops.map(String):null,
        ans:ans,exp:String(x.exp||'').trim(),unit:w.unit,kp:w.kp,ratio:isRatio?1:0,app:!Array.isArray(x.ops)&&!isRatio,source:'similar'};
    }).filter(function(x){return x.q&&x.ans});
    if(!qs.length)throw new Error('AI 返回的题目格式不对，再试一次');
    SIM_Q=qs;
    if(msg){msg.style.color='var(--green)';msg.textContent='✓ 出好了，开始做！'}
    setTimeout(function(){
      QS={qs:SIM_Q,i:0,mode:'gen',ok:0,title:'举一反三 · 同类题',log:[]};
      SIM_Q=null;
      go('quiz');
    },500);
  }).catch(function(e){
    if(msg){msg.style.color='var(--red)';msg.textContent='✕ '+e.message}
  });
}
function startWrongDue(){
  if(!permGate('wrong'))return;
  var due=S.wrong.filter(function(w){return !w.done&&w.due<=today()});
  var qs=due.map(function(w){var isRatio=/^\d+\s*[:：]\s*\d+$/.test(String(w.ans||'').trim());var q={q:w.q,ops:w.ops,ans:w.ans,ratio:w.ratio||(isRatio?1:0),exp:w.exp,unit:w.unit,kp:w.kp,lvl:2,app:w.proc&&!isRatio?1:0};return q});
  QS={qs:qs,i:0,mode:'wrong',idxList:due.map(function(w){return S.wrong.indexOf(w)}),ok:0,title:'错题重考',log:[]};
  go('quiz');
}

/* —— 应用题四步法（v3.11：按课本单元 + 知识点难度出题，覆盖全部 12 册课本）—— */
/* 应用题生成器清单缓存：按课本 id 自动失效，避免每次进页面重跑上百个生成器。
   修：每个生成器探测 6 次、命中一次即认定为应用题——旧代码只探测 1 次，而总复习 rev_mix
   的 app 标记只有约 60% 概率出现，导致总复习应用题时有时无。 */
var APPGEN_CACHE={bookId:null,list:[]};
function appGenList(){
  var bid=BOOK_DEF?BOOK_DEF.id:null;
  if(APPGEN_CACHE.bookId===bid&&APPGEN_CACHE.list.length)return APPGEN_CACHE.list;
  var out=[];
  (UNITS||[]).forEach(function(u){(u.kps||[]).forEach(function(kp){(kp.gens||[]).forEach(function(g){
    if(!GENS[g])return;
    var isApp=false;
    for(var i=0;i<6&&!isApp;i++){try{var t=GENS[g](u.id,kp.id);if(t&&t.app)isApp=true}catch(e){}}
    if(isApp)out.push({g:g,u:u.id,k:kp.id,lvl:GENLVL[g]||2});
  })})});
  APPGEN_CACHE={bookId:bid,list:out};
  return out;
}
/* 选择状态：u=单元 id（0=全册混合）；lv=难度 1基础/2提高/3挑战（0=合理搭配） */
var FOUR_PICK={u:0,lv:0};
function fourLvCount(u){
  var c={1:0,2:0,3:0};
  appGenList().forEach(function(x){
    if(u&&String(x.u)!==String(u))return;
    if(c[x.lvl]!==undefined)c[x.lvl]++;
  });
  return c;
}
function fourUnitOpts(){
  var list=appGenList(),n={},out=[];
  (UNITS||[]).forEach(function(u){n[u.id]=0});
  list.forEach(function(x){if(n[x.u]!==undefined)n[x.u]++});
  (UNITS||[]).forEach(function(u){if(n[u.id]>0)out.push({id:u.id,name:u.name,n:n[u.id]})});
  return out;
}
/* 降级链：指定单元+难度 → 该单元全部应用题 → 全册该难度 → 全册全部（保证永远有题） */
function fourPool(u,lv){
  var list=appGenList();
  if(!list.length)return [];
  var p=[];
  if(u&&lv)p=list.filter(function(x){return String(x.u)===String(u)&&x.lvl===lv});
  if(!p.length&&u)p=list.filter(function(x){return String(x.u)===String(u)});
  if(!p.length&&lv)p=list.filter(function(x){return x.lvl===lv});
  if(!p.length)p=list.slice();
  return p;
}
/* 合理搭配：应用题版 基础30% + 提高50% + 挑战20%（某难度在所选范围无题时退回该范围全部） */
function fourMixPool(u,n){
  var list=appGenList();
  var base=u?list.filter(function(x){return String(x.u)===String(u)}):list.slice();
  if(!base.length)base=list.slice();
  if(!base.length)return [];
  var out=[],tries=0;
  while(out.length<n&&tries<n*40){
    tries++;
    var r=Math.random(),lv=r<0.3?1:(r<0.8?2:3);
    var p=base.filter(function(x){return x.lvl===lv});
    if(!p.length)p=base;
    out.push(pick(p));
  }
  return out;
}
function fourLabel(){
  var un=null;
  (UNITS||[]).forEach(function(u){if(FOUR_PICK.u&&String(u.id)===String(FOUR_PICK.u))un=u});
  var lvName={0:'合理搭配',1:'基础',2:'提高',3:'挑战'}[FOUR_PICK.lv]||'合理搭配';
  return (un?un.name:'全册混合')+' · '+lvName;
}
function fourPickUnit(id){
  FOUR_PICK.u=id;

  if(FOUR_PICK.lv&&!c[FOUR_PICK.lv])FOUR_PICK.lv=0;   /* 新范围下该难度无题 → 回合理搭配 */

function startFourDrill(){
  if(!permGate('four'))return;
  var list=appGenList(),N=8;
  if(!list.length){VIEWS.four();return}
  if(FOUR_PICK.u&&!list.some(function(x){return String(x.u)===String(FOUR_PICK.u)}))FOUR_PICK.u=0;
  var u=FOUR_PICK.u,lv=FOUR_PICK.lv;
  /* 组内题面重抽：dedupPick 的 peek 对每个规格只采样一次题面，当课本把同一生成器复用到多个
     知识点（如六下 g_discount/g_cylV/g_scale 同时挂在总复习单元）时，两个规格可能抽到同一题面，
     触发 dedupPick 第三段「允许组内重复补满」的既定兜底。这里对重复项再调一次 makeQ（生成器每次
     调用都重新随机）即可拿到新题面；极小池重试上限后仍重复则保留，不影响题量。 */
  function redraw(specs){
    var qs=specs.map(makeQ),seen={},i,g2;
    for(i=0;i<qs.length;i++){
      g2=0;
      while(qs[i]&&seen[qs[i].q]&&g2<12){qs[i]=makeQ(specs[i]);g2++}
      if(qs[i])seen[qs[i].q]=1;
    }
    return qs;
  }
  function refill(){
    /* 修：旧代码用 pick 纯随机抽 8 题，同组可能撞到重复题面；改用 dedupPick（与智能出题器、应用题特训一致） */
    if(lv===0)return redraw(dedupPick(function(){return fourMixPool(u,N)},N));
    return redraw(dedupPick(function(){return fourPool(u,lv)},N));
  }
  var qs=refill();
  if(!qs.length)qs=redraw(dedupPick(function(){return list.slice()},N));   /* 极端兜底 */
  startQuiz(qs,'gen','应用题四步法 · '+fourLabel(),refill);
}

var REP_RANGE=null;   /* '7'|'30'|'90'|'all'|'custom'，页面内选择状态 */

/* 构造区间内每一天的日期键（含首尾）。跨月/跨年用 Date 累加自动进位，整月 30/31 天不漏天 */
function dateRangeKeys(fromKey,toKey){
  var keys=[],parts=fromKey.split('-'),d=new Date(+parts[0],+parts[1]-1,+parts[2]);
  var endParts=toKey.split('-'),end=new Date(+endParts[0],+endParts[1]-1,+endParts[2]);
  var guard=0;
  while(d<=end&&guard<800){
    keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
    d.setDate(d.getDate()+1);guard++;
  }
  return keys;
}
/* 时段起点日期键：n=7/30/90 → 含今天在内往回 n 天；'all' → 全部记录的最早日期（无记录则今天） */
function rangeStartKey(n){
  if(n==='all'){
    var ks=Object.keys(S.days||{}).sort();
    var cks=Object.keys((S.books||{})[BOOK_DEF.id]&&S.books[BOOK_DEF.id].days||{}).sort();
    ks=ks.concat(cks).sort();
    return ks.length?ks[0]:today();
  }
  var d=new Date();d.setDate(d.getDate()-(n-1));
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
/* 时段统计聚合：对区间内每一天累加总量 + 分单元（新数据读 byUnit；旧数据仅有总量，分单元显示"未细分"） */
function rangeAgg(fromKey,toKey){
  var keys=dateRangeKeys(fromKey,toKey);
  var tot={att:0,cor:0},days=0,perUnit={},activeDays=[];
  keys.forEach(function(k){
    var dv=(S.days||{})[k];
    var hasData=dv&&dv.att>0;
    if(hasData){days++;activeDays.push(k);tot.att+=dv.att;tot.cor+=dv.cor||0;
      Object.keys(dv.byUnit||{}).forEach(function(u){
        perUnit[u]=perUnit[u]||{att:0,cor:0};
        perUnit[u].att+=dv.byUnit[u].att;perUnit[u].cor+=dv.byUnit[u].cor||0;
      });
    }
  });
  return {keys:keys,tot:tot,days:days,perUnit:perUnit,activeDays:activeDays,
    spanDays:keys.length,empty:tot.att===0};
}

  <div class="grid3" style="text-align:center">
    <div><div style="font-size:26px;font-weight:900;color:var(--green)">${r.att||0}</div><span class="muted" style="font-size:12.5px">总练习题数</span></div>
    <div><div style="font-size:26px;font-weight:900;color:var(--orange)">${rateTxt}</div><span class="muted" style="font-size:12.5px">总正确率</span></div>
    <div><div style="font-size:26px;font-weight:900;color:var(--blue)">${(rep.from||'最早')+(rep.to?' ~ '+rep.to:' ~ 今天')}</div><span class="muted" style="font-size:12.5px">统计时段</span></div>
  </div></div>`;
  /* 每账号明细表（按时段练习量降序） */
  var us=(rep.users||[]).slice().sort(function(a,b){return (b.range.att||0)-(a.range.att||0)});
  h+=`<div class="card"><h2>👥 各账号时段表现</h2><table class="rep"><tr><th>账号</th><th>练习</th><th>正确率</th><th>天数</th><th>最近活跃</th><th>错题(未清)</th><th>详情</th></tr>`;
  us.forEach(function(u){
    var rg=u.range||{att:0,cor:0,days:0};
    var rr=rg.att?Math.round(rg.cor/rg.att*100):null;
    var litTotal=0,wrongLeft=0;
    (u.books||[]).forEach(function(b){litTotal+=b.lit||0;wrongLeft+=b.wrong||0});
    var unDone=Object.keys(rg.perUnit||{}).length;
    h+=`<tr>
      <td style="text-align:left">${u.name}${u.banned?' <span class="badge gray">封禁</span>':''}${u.role==='admin'?' 🛡':''}<br><span class="muted" style="font-size:11px">${u.phone}</span></td>
      <td>${rg.att||0}</td>
      <td>${rr===null?'—':rr+'%'}</td>
      <td>${rg.days||0}</td>
      <td>${u.lastActive||'<span class="muted">—</span>'}</td>
      <td>${wrongLeft}</td>
      <td>${unDone>0?`<a style="cursor:pointer;color:var(--blue);font-weight:700" onclick="toggleUserUnits('${u.phone}')">展开</a>`:'<span class="muted">—</span>'}</td>
    </tr>`;
    if(unDone>0){
      h+=`<tr id="units_${u.phone}" style="display:none"><td colspan="7" style="text-align:left;background:#FBFAF5">`;
      var parts=Object.keys(rg.perUnit).map(function(uid){
        var s=rg.perUnit[uid];var rr2=s.att?Math.round(s.cor/s.att*100):null;
        return `单元${uid}：${s.att} 题 / ${rr2===null?'—':rr2+'%'}`;
      });
      h+=parts.join(' ｜ ');
      h+='</td></tr>';
    }
  });
  h+='</table><p class="muted" style="font-size:12px;margin-top:6px">按时段练习量降序；「详情」展开该账号时段内分单元练习量与正确率。点亮知识点为累计口径，错题列=当前未清错题。</p></div>';
  return h;
}
function toggleUserUnits(phone){
  var tr=document.getElementById('units_'+phone);
  if(tr)tr.style.display=tr.style.display==='none'?'table-row':'none';
}
